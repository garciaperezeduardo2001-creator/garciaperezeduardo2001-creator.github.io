<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bienestar · My Team</title>
<meta name="theme-color" content="#14532d">
<link rel="icon" href="icon-192.png">
<style>
:root{--accent:#16a34a;--ink:#0f1f17;--ink2:#4b5d54;--line:#dfe7e2;--bg:#f4f7f5;--card:#fff;--soft:#e8f3ec}
@media (prefers-color-scheme:dark){:root{--ink:#e8f1ec;--ink2:#9fb3a8;--line:#2a3b33;--bg:#0d1813;--card:#14231c;--soft:#1b3127}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.badge{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
h1{font-size:19px;margin:0;line-height:1.2}
.sub{color:var(--ink2);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin-bottom:12px}
.q{font-weight:700;font-size:16.5px;margin-bottom:10px}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.scale button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;font-family:inherit;font-weight:700;font-size:17px;line-height:1;color:#fff;cursor:pointer;opacity:.38;transition:transform .12s,opacity .12s;min-width:0;padding:0}
.scale button.on{opacity:1;transform:scale(1.12);border-color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.18)}
.scale.done button:not(.on){opacity:.22}
.ends{display:flex;justify-content:space-between;color:var(--ink2);font-size:12.5px;margin-top:7px}
.players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.players button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-weight:600;font-size:15px;line-height:1.25;color:var(--ink);cursor:pointer}
.players button b{display:inline-block;min-width:26px;color:var(--accent)}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.who strong{font-size:18px}
.link{background:none;border:0;color:var(--accent);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:6px 0;text-decoration:underline}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:10px;resize:vertical;min-height:52px}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:22px 16px calc(14px + env(safe-area-inset-bottom))}
.bar .in{max-width:520px;margin:0 auto}
.send{width:100%;border:0;border-radius:14px;padding:16px;background:#25d366;color:#06301a;font-family:inherit;font-weight:800;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(37,211,102,.35)}
.send:disabled{background:var(--line);color:var(--ink2);box-shadow:none;cursor:default}
.ok{text-align:center;padding:26px 10px}
.ok .big{font-size:52px;line-height:1}
.msg{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:10px;padding:10px;text-align:left;margin:12px 0}
.btn2{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{border:0;border-radius:11px;padding:10px 6px;background:transparent;color:var(--ink2);font-family:inherit;font-weight:700;font-size:15px;line-height:1.15;cursor:pointer}
.tabs button small{display:block;font-weight:500;font-size:12px;opacity:.85}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.rpe{display:flex;flex-direction:column;gap:6px}
.rpe button{display:flex;align-items:center;gap:12px;border:2px solid transparent;border-radius:12px;padding:8px 12px;background:var(--soft);color:var(--ink);font-family:inherit;font-size:15.5px;font-weight:600;text-align:left;cursor:pointer}
.rpe button b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
.rpe.done button:not(.on){opacity:.45}
.rpe button.on{border-color:var(--ink);background:var(--card);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.tip{font-size:13.5px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:8px 10px;margin:-2px 0 12px}
.qr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}
.qr img{width:min(86vw,420px);height:auto;image-rendering:pixelated;background:#fff;padding:10px;border-radius:12px}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<main id="app"></main>
<div class="bar" id="bar" hidden><div class="in"><button class="send" id="send" disabled></button></div></div>
<script>
(function () {
  'use strict';
  var EN = !/^es\b/i.test(navigator.language || 'es');
  var T = function (es, en) { return EN ? en : es; };
  document.documentElement.lang = EN ? 'en' : 'es';
  var app = document.getElementById('app'), bar = document.getElementById('bar'), sendBtn = document.getElementById('send');
  var h = function (tag, attrs) {
    var el = document.createElement(tag), kids = [].slice.call(arguments, 2);
    for (var k in (attrs || {})) { if (k === 'onclick') el.onclick = attrs[k]; else if (k === 'text') el.textContent = attrs[k]; else if (attrs[k] != null) el.setAttribute(k, attrs[k]); }
    (function add(list) { list.forEach(function (c) { if (c == null) return; if (Array.isArray(c)) return add(c); el.append(c.nodeType ? c : document.createTextNode(String(c))); }); })(kids);
    return el;
  };
  // ---- datos del enlace (#d=base64url) ----
  var params = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) params[kv.slice(0, i)] = kv.slice(i + 1); });
  var data = null;
  try {
    var b = (params.d || '').replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
    var txt = new TextDecoder().decode(Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); }));
    var lines = txt.split('\n');
    if (lines[0] === 'MT1') data = { team: lines[1], color: lines[2], phone: lines[3], players: lines.slice(4).filter(Boolean).map(function (l) { var a = l.split('\t'); return { id: a[0], dorsal: a[1], name: a[2] }; }) };
  } catch (e) { data = null; }
  if (!data || !data.players.length) {
    app.append(h('div', { class: 'card ok' }, h('div', { class: 'big' }, '🔗'), h('h1', null, T('Enlace incompleto', 'Incomplete link')),
      h('p', { class: 'sub' }, T('Pide a tu entrenador el enlace del cuestionario de bienestar.', 'Ask your coach for the wellness questionnaire link.'))));
    return;
  }
  if (/^#[0-9a-f]{6}$/i.test(data.color)) {
    document.documentElement.style.setProperty('--accent', data.color);
    var mc = document.querySelector('meta[name=theme-color]'); if (mc) mc.content = data.color;
  }
  document.title = T('Bienestar y RPE · ', 'Wellness & RPE · ') + data.team;
  var initials = data.team.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase() || 'MT';
  var now = new Date(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var dShort = pad(now.getDate()) + '/' + pad(now.getMonth() + 1) + '/' + String(now.getFullYear()).slice(2);
  var dLong = now.toLocaleDateString(EN ? 'en-GB' : 'es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  var head = function (title) { return h('header', null, h('div', { class: 'badge' }, initials), h('div', null, h('h1', null, title), h('div', { class: 'sub' }, data.team + ' · ' + dLong))); };
  var KEY = 'mt-well-' + data.team;
  var store = { get: function () { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } },
    set: function (o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} } };

  // ---- modo QR para el vestuario ----
  if (params.qr) {
    var url = location.href.replace(/&qr=1/, '');
    var box = h('div', { class: 'qr' }, head(T('Cuestionario de bienestar', 'Wellness questionnaire')));
    app.append(box);
    var s = document.createElement('script'); s.src = 'qrcode.js';
    s.onload = function () {
      var q = qrcode(0, 'L'); q.addData(url); q.make();
      box.append(h('img', { src: q.createDataURL(8, 2), alt: T('Código QR del cuestionario', 'Questionnaire QR code') }),
        h('div', { class: 'q' }, T('Escanéalo con la cámara', 'Scan it with your camera')),
        h('div', { class: 'sub' }, T('Antes de entrenar: bienestar (4 preguntas) · Después: RPE · Se envía por WhatsApp', 'Before training: wellness (4 questions) · After: RPE · Sent via WhatsApp')),
        h('button', { class: 'btn2 noprint', onclick: function () { print(); } }, T('Imprimir', 'Print')));
    };
    s.onerror = function () { box.append(h('p', { class: 'sub' }, T('No se pudo generar el QR. Comprueba la conexión.', 'Could not create the QR code. Check your connection.'))); };
    document.head.append(s);
    return;
  }

  // ---- cuestionario ----
  var Q = [
    ['sueno', T('¿Cómo has dormido?', 'How did you sleep?'), T('Muy bien', 'Very well'), T('Muy mal', 'Very badly'), T('Sueño', 'Sleep')],
    ['fatiga', T('¿Cómo de cansado estás?', 'How tired are you?'), T('Nada', 'Not at all'), T('Muchísimo', 'Exhausted'), T('Fatiga', 'Fatigue')],
    ['estres', T('¿Cuánto estrés tienes?', 'How stressed are you?'), T('Nada', 'None'), T('Muchísimo', 'Extreme'), T('Estrés', 'Stress')],
    ['dolor', T('¿Agujetas o dolor muscular?', 'Muscle soreness?'), T('Nada', 'None'), T('Muchísimo', 'Extreme'), T('Dolor', 'Soreness')]
  ];
  var COLORS = ['#16a34a', '#4fae3b', '#8bbb2e', '#d4b106', '#ee8a12', '#e4572e', '#c81e1e'];
  var ans = {}, note = '', rpe = null, mode = null;
  var RPE = [[0, T('Reposo', 'Rest')], [1, T('Muy, muy suave', 'Very, very easy')], [2, T('Suave', 'Easy')], [3, T('Moderado', 'Moderate')], [4, T('Algo duro', 'Somewhat hard')],
    [5, T('Duro', 'Hard')], [6, T('Duro +', 'Hard +')], [7, T('Muy duro', 'Very hard')], [8, T('Muy duro +', 'Very hard +')], [9, T('Casi máximo', 'Almost maximal')], [10, T('Máximo', 'Maximal')]];
  var RCOL = ['#7fb7d6', '#16a34a', '#3fa63d', '#78b52f', '#b7b81f', '#d4a106', '#e98b12', '#e8691f', '#e04a27', '#cf2a1f', '#a4161a'];

  function pickPlayer() {
    bar.hidden = true;
    app.replaceChildren(head(T('Cuestionario de bienestar', 'Wellness questionnaire')),
      h('div', { class: 'card' }, h('div', { class: 'q' }, T('¿Quién eres?', 'Who are you?')),
        h('div', { class: 'sub', style: 'margin:-4px 0 12px' }, T('Solo te lo preguntamos la primera vez.', "We'll only ask this once.")),
        h('div', { class: 'players' }, data.players.map(function (p) {
          return h('button', { type: 'button', onclick: function () { var st = store.get(); st.me = p.id; store.set(st); form(); } }, p.dorsal ? h('b', null, p.dorsal) : null, p.name);
        }))));
  }
  function me() { var st = store.get(); return data.players.filter(function (p) { return p.id === st.me; })[0] || null; }
  function message(p) {
    if (mode === 'rpe') {
      var rl = ['RPE · ' + dShort, p.name + (p.dorsal ? ' (' + p.dorsal + ')' : ''), 'RPE ' + rpe + ' · ' + RPE[rpe][1]];
      if (note.trim()) rl.push(T('Comentario: ', 'Comment: ') + note.trim().replace(/[\[\]\n]/g, ' '));
      rl.push('[MT ' + p.id + ' R' + rpe + ' ' + dShort + ']');
      return rl.join('\n');
    }
    var lines = [T('Bienestar', 'Wellness') + ' · ' + dShort, p.name + (p.dorsal ? ' (' + p.dorsal + ')' : ''),
      Q.map(function (q) { return q[4] + ' ' + ans[q[0]]; }).join(' · ')];
    if (note.trim()) lines.push(T('Molestias: ', 'Niggles: ') + note.trim().replace(/[\[\]\n]/g, ' '));
    lines.push('[MT ' + p.id + ' ' + Q.map(function (q) { return ans[q[0]]; }).join('-') + ' ' + dShort + ']');
    return lines.join('\n');
  }
  function tabs() {
    var mk = function (m, t, sub) { return h('button', { type: 'button', class: mode === m ? 'on' : '', 'aria-pressed': mode === m ? 'true' : 'false', onclick: function () { if (mode !== m) { mode = m; form(); } } }, t, h('small', null, sub)); };
    return h('div', { class: 'tabs' }, mk('well', T('Bienestar', 'Wellness'), T('antes de entrenar', 'before training')), mk('rpe', 'RPE', T('después de entrenar', 'after training')));
  }
  function rpeForm(p, st) {
    rpe = null; note = '';
    var list = h('div', { class: 'rpe', role: 'radiogroup', 'aria-label': T('Esfuerzo de la sesión', 'Session effort') });
    RPE.forEach(function (r) {
      var b = h('button', { type: 'button', role: 'radio', 'aria-checked': 'false' }, h('b', { style: 'background:' + RCOL[r[0]] }, r[0]), r[1]);
      b.onclick = function () { rpe = r[0]; list.classList.add('done'); [].forEach.call(list.children, function (x) { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b ? 'true' : 'false'); }); upd(); };
      list.append(b);
    });
    var ta = h('textarea', { rows: 2, maxlength: 140, placeholder: T('Ej.: me retiré antes por una molestia', 'e.g. left early with a niggle') });
    ta.oninput = function () { note = ta.value; };
    app.replaceChildren.apply(app, [head(T('¿Cómo de dura ha sido la sesión?', 'How hard was the session?')),
      h('div', { class: 'who' }, h('div', null, h('div', { class: 'sub' }, T('Respondes como', 'Answering as')), h('strong', null, (p.dorsal ? p.dorsal + ' · ' : '') + p.name)),
        h('button', { class: 'link', type: 'button', onclick: pickPlayer }, T('No soy yo', 'Not me'))),
      tabs(),
      h('div', { class: 'tip' }, T('Contesta entre 15 y 30 minutos después de terminar, pensando en la sesión entera, no solo en el final.', 'Answer 15–30 minutes after finishing, thinking about the whole session, not just the end.')),
      h('div', { class: 'card' }, h('div', { class: 'q' }, T('Esfuerzo de toda la sesión (0–10)', 'Effort for the whole session (0–10)')), list),
      h('div', { class: 'card' }, h('div', { class: 'q' }, T('¿Algo que comentar? (opcional)', 'Anything to add? (optional)')), ta),
      st.lastR === dShort ? h('p', { class: 'sub', style: 'text-align:center' }, T('Ya enviaste el RPE hoy. Si lo vuelves a enviar, cuenta el último.', 'You already sent your RPE today. If you send it again, the latest one counts.')) : null].filter(Boolean));
    bar.hidden = false; upd(); window.scrollTo(0, 0);
  }
  function form() {
    var p = me(); if (!p) return pickPlayer();
    var st = store.get(); ans = {}; note = '';
    if (!mode) mode = st.last === dShort && st.lastR !== dShort ? 'rpe' : 'well';
    if (mode === 'rpe') return rpeForm(p, st);
    var cards = Q.map(function (q, qi) {
      var sc = h('div', { class: 'scale', role: 'radiogroup', 'aria-label': q[1] });
      for (var v = 1; v <= 7; v++) (function (v) {
        var b = h('button', { type: 'button', role: 'radio', 'aria-checked': 'false', 'aria-label': v + (v === 1 ? ' · ' + q[2] : v === 7 ? ' · ' + q[3] : ''), style: 'background:' + COLORS[v - 1] }, v);
        b.onclick = function () {
          ans[q[0]] = v; sc.classList.add('done');
          [].forEach.call(sc.children, function (x) { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b ? 'true' : 'false'); });
          upd();
          var next = cards[qi + 1]; if (next && ans[Q[qi + 1][0]] == null) setTimeout(function () { next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 120);
        };
        sc.append(b);
      })(v);
      return h('div', { class: 'card' }, h('div', { class: 'q' }, (qi + 1) + '. ' + q[1]), sc, h('div', { class: 'ends' }, h('span', null, '1 · ' + q[2]), h('span', null, q[3] + ' · 7')));
    });
    var ta = h('textarea', { rows: 2, maxlength: 140, placeholder: T('Ej.: carga en el isquio derecho', 'e.g. tight right hamstring') });
    ta.oninput = function () { note = ta.value; };
    app.replaceChildren.apply(app, [head(T('¿Cómo estás hoy?', 'How are you today?')),
      h('div', { class: 'who' }, h('div', null, h('div', { class: 'sub' }, T('Respondes como', 'Answering as')), h('strong', null, (p.dorsal ? p.dorsal + ' · ' : '') + p.name)),
        h('button', { class: 'link', type: 'button', onclick: pickPlayer }, T('No soy yo', 'Not me'))),
      tabs(), cards[0], cards[1], cards[2], cards[3],
      h('div', { class: 'card' }, h('div', { class: 'q' }, T('¿Alguna molestia? (opcional)', 'Any niggles? (optional)')), ta),
      st.last === dShort ? h('p', { class: 'sub', style: 'text-align:center' }, T('Ya enviaste el cuestionario hoy. Si lo vuelves a enviar, cuenta el último.', 'You already sent it today. If you send it again, the latest one counts.')) : null].filter(Boolean));
    bar.hidden = false; upd(); window.scrollTo(0, 0);
  }
  function upd() {
    if (mode === 'rpe') { sendBtn.disabled = rpe == null; sendBtn.textContent = rpe == null ? T('Elige un número del 0 al 10', 'Pick a number from 0 to 10') : T('Enviar RPE por WhatsApp', 'Send RPE via WhatsApp'); return; }
    var n = Q.filter(function (q) { return ans[q[0]] != null; }).length;
    sendBtn.disabled = n < 4;
    sendBtn.textContent = n < 4 ? T('Responde las 4 preguntas (' + n + '/4)', 'Answer all 4 questions (' + n + '/4)') : T('Enviar por WhatsApp', 'Send via WhatsApp');
  }
  sendBtn.onclick = function () {
    var p = me(); if (!p) return;
    var msg = message(p), phone = (data.phone || '').replace(/\D/g, '');
    var url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
    var st = store.get(); if (mode === 'rpe') st.lastR = dShort; else st.last = dShort; store.set(st);
    done(msg);
    var w = window.open(url, '_blank');
    if (w) { try { w.opener = null; } catch (e) {} } else location.href = url;
  };
  function done(msg) {
    bar.hidden = true;
    var copyBtn = h('button', { class: 'btn2', type: 'button' }, T('Copiar mensaje', 'Copy message'));
    copyBtn.onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(function () { copyBtn.textContent = T('Copiado ✓', 'Copied ✓'); }, function () { copyBtn.textContent = T('Mantén pulsado el texto para copiarlo', 'Long-press the text to copy it'); }); };
    app.replaceChildren(head(T('¡Gracias!', 'Thanks!')), h('div', { class: 'card ok' }, h('div', { class: 'big' }, '✅'),
      h('div', { class: 'q', style: 'margin-top:10px' }, T('Envía el mensaje en WhatsApp', 'Send the message in WhatsApp')),
      h('div', { class: 'sub' }, T('Si no se ha abierto WhatsApp, copia el mensaje y mándaselo a tu entrenador sin cambiarlo.', "If WhatsApp didn't open, copy the message and send it to your coach as it is.")),
      h('div', { class: 'msg' }, msg), copyBtn, ' ',
      h('button', { class: 'btn2', type: 'button', onclick: form }, T('Cambiar respuestas', 'Change answers'))));
  }
  form();
})();
</script>
</body>
</html>
