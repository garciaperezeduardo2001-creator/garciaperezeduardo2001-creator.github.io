<style>
/* Layout: sticky scoreboard-style header with tab bar; one working view at a time; the pitch is the visual centrepiece of Partidos. */
:root {
  --bg: #f4f6f3;
  --panel: #ffffff;
  --ink: #12201a;
  --ink-2: #4a5a52;
  --ink-3: #7b8a82;
  --line: #dde4df;
  --line-2: #eef2ef;
  --accent: #23408e;          /* chalkboard navy: UI accent */
  --accent-soft: #e6ebf7;
  --bar: #2a78d6;             /* series 1 */
  --bar-hi: #1b5fb0;
  --grass-1: #2f7d4a;
  --grass-2: #2a7243;
  --chalk: rgba(255,255,255,.82);
  --z-low: #6f8fb0;           /* status: carga baja */
  --z-ok: #1f9d55;            /* status: óptimo */
  --z-warn: #d48a00;          /* status: precaución */
  --z-bad: #d23c3c;           /* status: riesgo */
  --z-low-bg: #e7eef6; --z-ok-bg: #e2f4e9; --z-warn-bg: #fbf0d9; --z-bad-bg: #fbe4e4;
  --win: #1f9d55; --draw: #d48a00; --loss: #d23c3c;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1613; --panel: #16201b; --ink: #e8efe9; --ink-2: #b2c0b7; --ink-3: #82938a; --line: #26332c; --line-2: #1c2721;
  --accent: #8ea6ec; --accent-soft: #1f2a45; --bar: #3987e5; --bar-hi: #66a3ee; --grass-1: #1f5a34; --grass-2: #1b5130; --chalk: rgba(255,255,255,.7);
  --z-low: #86a6c8; --z-ok: #3cb872; --z-warn: #e3a12a; --z-bad: #ec6464;
  --z-low-bg: #1d2a38; --z-ok-bg: #16301f; --z-warn-bg: #36290c; --z-bad-bg: #3a1a1a;
  --win: #3cb872; --draw: #e3a12a; --loss: #ec6464; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1613; --panel: #16201b; --ink: #e8efe9; --ink-2: #b2c0b7; --ink-3: #82938a; --line: #26332c; --line-2: #1c2721;
  --accent: #8ea6ec; --accent-soft: #1f2a45; --bar: #3987e5; --bar-hi: #66a3ee; --grass-1: #1f5a34; --grass-2: #1b5130; --chalk: rgba(255,255,255,.7);
  --z-low: #86a6c8; --z-ok: #3cb872; --z-warn: #e3a12a; --z-bad: #ec6464;
  --z-low-bg: #1d2a38; --z-ok-bg: #16301f; --z-warn-bg: #36290c; --z-bad-bg: #3a1a1a;
  --win: #3cb872; --draw: #e3a12a; --loss: #ec6464; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 12px 6px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.7rem; letter-spacing: .01em; margin: 0; line-height: 1; text-transform: uppercase; }
.brand h1 small { display: block; font-family: var(--body); font-weight: 500; font-size: .78rem; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.datasrc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .8rem; color: var(--ink-3); }
.btn { font: 600 .85rem var(--body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent, var(--panel)); }
.btn.primary:hover { filter: brightness(1.1); color: var(--on-accent, var(--panel)); }
.btn:focus-visible, select:focus-visible, .tab:focus-visible, .chip:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { font: 700 .95rem var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding: 10px 12px 9px; border-bottom: 3px solid transparent; text-decoration: none; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
main { padding-block: 20px 48px; }
.view-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; text-transform: uppercase; letter-spacing: .02em; margin: 0; line-height: 1.1; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 700; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; color: var(--ink-2); }
.sub { color: var(--ink-3); font-size: .85rem; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.kpi .l { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.kpi .v { font-family: var(--display); font-weight: 700; font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: .9rem; color: var(--ink-3); font-weight: 600; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .88rem; }
th { font: 600 .7rem var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { all: unset; cursor: pointer; }
th button:hover { color: var(--ink); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line-2); text-align: right; white-space: nowrap; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tbody tr:hover td { background: var(--line-2); }
td.name { font-weight: 600; }
.muted { color: var(--ink-3); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: .75rem; font-weight: 700; letter-spacing: .02em; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.z-low { color: var(--z-low); background: var(--z-low-bg); }
.z-ok { color: var(--z-ok); background: var(--z-ok-bg); }
.z-warn { color: var(--z-warn); background: var(--z-warn-bg); }
.z-bad { color: var(--z-bad); background: var(--z-bad-bg); }
.z-none { color: var(--ink-3); background: var(--line-2); }
.res { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; color: var(--panel); font: 700 .8rem var(--display); }
.res.V { background: var(--win); } .res.E { background: var(--draw); } .res.D { background: var(--loss); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select { font: 600 .9rem var(--body); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: none; display: grid; justify-items: center; gap: 2px; min-width: 64px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); cursor: pointer; font: inherit; color: var(--ink); }
.chip .j { font: 700 .8rem var(--display); letter-spacing: .05em; color: var(--ink-3); }
.chip .sc { font: 700 1.05rem var(--display); font-variant-numeric: tabular-nums; }
.chip.dis { opacity: .55; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.chip .bar.V { background: var(--win); } .chip .bar.E { background: var(--draw); } .chip .bar.D { background: var(--loss); }

/* Scoreboard */
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 16px; }
.scoreboard .team { font: 700 1.25rem var(--display); text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }
.scoreboard .team.r { text-align: right; }
.scoreboard .team.us { color: var(--accent); }
.scoreboard .score { font: 800 2.6rem var(--display); font-variant-numeric: tabular-nums; padding: 0 14px; border-radius: 10px; background: var(--line-2); line-height: 1.25; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; color: var(--ink-3); font-size: .85rem; padding-bottom: 12px; }
.halves { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 0; font-variant-numeric: tabular-nums; font-size: .88rem; }
.halves div { padding: 6px 8px; border-bottom: 1px solid var(--line-2); text-align: right; }
.halves div.h { font-size: .7rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.halves div.k { text-align: left; color: var(--ink-2); }

/* Pitch */
.matchgrid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .matchgrid { grid-template-columns: 1fr; } }
.pitch { position: relative; width: 100%; max-width: 100%; aspect-ratio: 68 / 92; border-radius: 12px; overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--grass-1) 0 9.09%, var(--grass-2) 9.09% 18.18%); }
.pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.pl { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; width: 84px; text-align: center; }
.pl .shirt { position: relative; width: 38px; height: 38px; border-radius: 50%; background: #ffffff; color: #12201a; display: grid; place-items: center; font: 800 1rem var(--display); box-shadow: 0 2px 6px rgba(0,0,0,.35); border: 2px solid #12201a; }
.pl.gk .shirt { background: #f2c230; }
.pl .nm { font: 700 .82rem var(--display); color: #ffffff; letter-spacing: .03em; text-transform: uppercase; text-shadow: 0 1px 3px rgba(0,0,0,.6); line-height: 1.05; }
.pl .mn { font: 600 .7rem var(--body); color: rgba(255,255,255,.85); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.pl .ev { position: absolute; top: -6px; right: -16px; font: 700 .66rem var(--body); padding: 1px 4px; border-radius: 5px; background: #ffffff; color: #b42525; box-shadow: 0 1px 3px rgba(0,0,0,.3); white-space: nowrap; }
.pl .ev.g { right: auto; left: -16px; color: #12201a; }
.pitch .pos { font: 600 .6rem var(--body); color: rgba(255,255,255,.65); letter-spacing: .06em; }
.legendrow { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--ink-3); margin-top: 8px; }
.sw { display: inline-block; width: 12px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

/* Minutes timeline */
.tl { display: grid; grid-template-columns: 96px minmax(0,1fr) 40px; gap: 4px 8px; align-items: center; font-size: .82rem; }
.tl .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl .who small { color: var(--ink-3); font-weight: 500; }
.tl .track { position: relative; height: 14px; background: var(--line-2); border-radius: 3px; }
.tl .seg { position: absolute; top: 0; bottom: 0; background: var(--bar); border-radius: 3px; }
.tl .seg.sub { background: var(--z-ok); }
.tl .min { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 600; }
.tl .axis { position: relative; height: 16px; font-size: .68rem; color: var(--ink-3); }
.tl .axis span { position: absolute; transform: translateX(-50%); }
.tl .half { position: absolute; top: -2px; bottom: -2px; left: 50%; width: 1px; background: var(--ink-3); opacity: .5; }

.subs { display: grid; gap: 4px; font-size: .86rem; }
.subs div { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line-2); }
.subs .m { font: 700 .95rem var(--display); color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.in { color: var(--z-ok); font-weight: 700; } .out { color: var(--z-bad); font-weight: 700; }
.cron { white-space: pre-wrap; color: var(--ink-2); font-size: .88rem; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font: 500 11px var(--body); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--bar); }
.chart .bar:hover, .chart .bar.hot { fill: var(--bar-hi); }
.chart .mline { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: .8rem; box-shadow: 0 6px 18px rgba(0,0,0,.14); min-width: 110px; }
.tip b { font: 700 1.05rem var(--display); display: block; font-variant-numeric: tabular-nums; }
.gauge { position: relative; width: 120px; height: 10px; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; background: var(--line-2); }
.gauge i { position: absolute; top: 0; bottom: 0; }
.gauge b { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 1px; }
.minibar { display: inline-block; height: 8px; border-radius: 2px; background: var(--bar); vertical-align: middle; }
.note { font-size: .8rem; color: var(--ink-3); margin-top: 8px; }
.empty { padding: 28px; text-align: center; color: var(--ink-3); }
.flash { font-size: .8rem; padding: 4px 9px; border-radius: 6px; background: var(--z-ok-bg); color: var(--z-ok); font-weight: 600; }
.flash.err { background: var(--z-bad-bg); color: var(--z-bad); }
.alerts { display: grid; gap: 6px; }
.alerts div { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
@media (prefers-reduced-motion: no-preference) { .pl { transition: left .35s ease, top .35s ease; } }
@media (max-width: 520px) {
  .pl { width: 70px; } .pl .shirt { width: 30px; height: 30px; font-size: .85rem; } .pl .nm { font-size: .7rem; } .pl .mn { display: none; }
  .scoreboard .score { font-size: 2rem; } .scoreboard .team { font-size: 1rem; }
  .tl { grid-template-columns: 76px minmax(0,1fr) 34px; }
}

/* --- editing --- */
input[type=number], input[type=text], input[type=date], textarea, select.f { font: 500 .9rem var(--body); padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); min-width: 0; }
input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=number] { font-variant-numeric: tabular-nums; }
input.n { width: 62px; text-align: center; }
input.n.s { width: 52px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
textarea { width: 100%; resize: vertical; min-height: 64px; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
.formgrid .wide { grid-column: 1 / -1; }
label.f { display: grid; gap: 4px; font-size: .72rem; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; min-width: 0; }
label.f > * { text-transform: none; letter-spacing: 0; }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.btn.danger { color: var(--z-bad); border-color: var(--z-bad-bg); }
.btn.danger:hover { border-color: var(--z-bad); color: var(--z-bad); }
.btn.sm { padding: 4px 9px; font-size: .78rem; }
.btn:disabled { opacity: .5; cursor: default; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-radius: 8px; background: var(--z-bad-bg); color: var(--z-bad); font-weight: 600; font-size: .85rem; }
.info { padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: .85rem; font-weight: 600; }
.warnbox { padding: 8px 12px; border-radius: 8px; background: var(--z-warn-bg); color: var(--z-warn); font-size: .85rem; font-weight: 600; }
tr.off td { opacity: .55; }
tr.off td:first-child, tr.off td.keep { opacity: 1; }
td input[type=number], td input[type=text], td select.f { padding: 4px 6px; font-size: .85rem; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 9px; font-weight: 600; font-size: .88rem; box-shadow: 0 8px 22px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
.toast.err { background: var(--z-bad); color: #fff; }
.rpecell { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.loadprev { min-width: 44px; color: var(--ink-3); font-size: .78rem; font-variant-numeric: tabular-nums; }
.section-gap { margin-top: 14px; }
.headbtns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status { font-size: .78rem; color: var(--ink-3); }
.status b { color: var(--z-ok); }
input.n.xs { width: 42px; padding-inline: 4px; }
td select.f { max-width: 140px; }
.brandid { display: flex; align-items: center; gap: 12px; min-width: 0; }
.crest { width: 52px; height: 52px; border-radius: 12px; flex: none; object-fit: cover; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
@media (max-width: 520px) { .crest { width: 42px; height: 42px; border-radius: 10px; } }
.stick-r { position: sticky; right: 0; background: var(--panel); box-shadow: -8px 0 8px -8px rgba(0,0,0,.18); }
tbody tr:hover td.stick-r { background: var(--line-2); }
</style>

<script>
/* Vestuario app: base de datos local (IndexedDB, con respaldo en localStorage) con la misma interfaz que la de Claude */
(function () {
  window.__APP = true; window.__MYTEAM = true;
  const mem = {};            // ruta de colección -> { id: datos }
  const listeners = {};      // ruta -> [fn]
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
  let idb = null;
  const LS = 'myteam:';
  const ready = new Promise(resolve => {
    const fromLS = () => { try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(LS)) mem[k.slice(LS.length)] = JSON.parse(localStorage.getItem(k)); } } catch (_) {} };
    let req;
    try { req = indexedDB.open('myteam', 1); } catch (_) { fromLS(); resolve(); return; }
    req.onupgradeneeded = () => req.result.createObjectStore('cols');
    req.onerror = () => { fromLS(); resolve(); };
    req.onsuccess = () => {
      idb = req.result;
      const tx = idb.transaction('cols', 'readonly'), st = tx.objectStore('cols');
      const cur = st.openCursor();
      cur.onsuccess = () => { const c = cur.result; if (c) { mem[c.key] = c.value; c.continue(); } else resolve(); };
      cur.onerror = () => { fromLS(); resolve(); };
    };
  });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}
  const persist = path => new Promise((ok, ko) => {
    const val = mem[path] || {};
    if (idb) {
      const tx = idb.transaction('cols', 'readwrite');
      tx.objectStore('cols').put(val, path);
      tx.oncomplete = () => ok(); tx.onerror = () => ko({ code: 'quota_exceeded', message: 'No hay espacio en el móvil' });
    } else { try { localStorage.setItem(LS + path, JSON.stringify(val)); ok(); } catch (e) { ko({ code: 'quota_exceeded', message: 'No hay espacio en el móvil' }); } }
  });
  const snap = path => ({ docs: Object.entries(mem[path] || {}).map(([id, b]) => ({ id, exists: true, data: () => clone(b) })) });
  const notify = path => (listeners[path] || []).slice().forEach(fn => { try { fn(snap(path)); } catch (e) { console.error(e); } });
  const docRef = (path, id) => ({
    id,
    async get() { await ready; const b = (mem[path] || {})[id]; return { id, exists: b !== undefined, data: () => clone(b) }; },
    async set(b) { await ready; (mem[path] = mem[path] || {})[id] = clone(b); await persist(path); notify(path); },
    async delete() { await ready; if (mem[path]) { delete mem[path][id]; await persist(path); } notify(path); }
  });
  const db = {
    collection: path => ({
      onSnapshot(next) {
        const L = (listeners[path] = listeners[path] || []); L.push(next);
        ready.then(() => { if (L.includes(next)) next(snap(path)); });
        return () => { const i = L.indexOf(next); if (i >= 0) L.splice(i, 1); };
      },
      async get() { await ready; return snap(path); },
      doc: id => docRef(path, id)
    }),
    doc: p => { const i = p.lastIndexOf('/'); return docRef(p.slice(0, i), p.slice(i + 1)); }
  };
  const user = { canEdit: async () => false, can: async () => true, isOwner: async () => true };
  const downloads = {
    async save({ filename, data }) {
      const type = /\.json$/i.test(filename) ? 'application/json' : /\.html?$/i.test(filename) ? 'text/html' : /\.pdf$/i.test(filename) ? 'application/pdf' : /\.xlsx$/i.test(filename) ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : 'application/octet-stream';
      const blob = new Blob([data], { type });
      try {
        const file = new File([blob], filename, { type });
        if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
          await navigator.share({ files: [file], title: filename });
          return;
        }
      } catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' }; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }
  };
  window.claude = { use: async n => n === 'db' ? db : n === 'user' ? user : n === 'downloads' ? downloads : null };
  if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>

      const w = {}; let wbad = false; WELL_ITEMS.forEach(([k]) => { const x = val('w-' + p.id + '-' + k); if (x != null) { if (x < 1 || x > 7) wbad = true; w[k] = x; } });
      if (wbad) bad = p.name + ' (bienestar 1–7)';
      if (Object.keys(w).length) (out.well = out.well || {})[p.id] = w;
      const why = sval('au-' + p.id); if (v == null && why) (out.aus = out.aus || {})[p.id] = why;
    }
    // keep values of hidden (Baja) players untouched
    for (const [pid, v] of Object.entries(doc.rpe || {})) if (!plist.some(p => p.id === pid)) out.rpe[pid] = v;
    if (bad) { toast('Revisa los valores de ' + bad + ': RPE de 0 a 10 y bienestar de 1 a 7', true); return; }
    for (const [pid, w] of Object.entries(doc.well || {})) if (!plist.some(p => p.id === pid)) (out.well = out.well || {})[pid] = w;
    if (!Object.keys(out.rpe).length) { toast('Escribe al menos un RPE', true); return; }
    const id = d0 ? d0.id : 's' + date + '-' + Math.random().toString(36).slice(2, 6);
    saveBtn.disabled = true; saveBtn.textContent = 'Guardando…';
    try { await writeDoc('sessions', id, out); toast('Sesión guardada: ' + Object.keys(out.rpe).length + ' jugadores'); close(); }
    catch (e) { toast(errText(e), true); saveBtn.disabled = false; saveBtn.textContent = 'Guardar sesión'; }
  });

$('#fileIn').addEventListener('change', e => {

});
function askImport(D, fname) {
  const area = vPlantilla.importArea || $('#main');
  const summary = `${D.players.length} jugadores, ${D.sessions.length} sesiones, ${D.matches.filter(m => m.gf1 != null || m.gc1 != null).length} partidos jugados` + (D.skipped ? ` (${D.skipped} filas sin jugador o sesión que se omiten)` : '');
  const hasAny = MODEL && hasData(MODEL.docs);
  area.replaceChildren(h('div', { class: hasAny ? 'confirm section-gap' : 'info section-gap', style: 'display:flex;gap:8px;flex-wrap:wrap;align-items:center' },
    h('span', null, `${fname}: ${summary}. ` + (hasAny ? 'Esto reemplazará todos los datos actuales de la página.' : '')),
    h('button', { class: 'btn sm primary', type: 'button', onclick: () => doImport(D, area) }, hasAny ? 'Reemplazar datos' : 'Importar'),
    h('button', { class: 'btn sm', type: 'button', onclick: () => area.replaceChildren() }, 'Cancelar')));
}
async function doImport(D, area) {
  const jobs = [['config', 'main', D.config], ['table', 'main', D.table]];
  D.players.forEach(({ id, ...b }) => jobs.push(['players', id, b]));
  D.sessions.forEach(({ id, ...b }) => jobs.push(['sessions', id, b]));
  D.matches.forEach(({ id, ...b }) => jobs.push(['matches', id, b]));
  const keep = { players: new Set(D.players.map(x => x.id)), sessions: new Set(D.sessions.map(x => x.id)), matches: new Set(D.matches.map(x => x.id)) };
  for (const c of ['injuries', 'tests', 'league', 'objectives']) if (D[c]) { D[c].forEach(({ id, ...b }) => jobs.push([c, id, b])); keep[c] = new Set(D[c].map(x => x.id)); }
  const dels = [];
  for (const c of Object.keys(keep)) for (const id of store.cache[c].keys()) if (!keep[c].has(id)) dels.push([c, id]);
  const prog = h('div', { class: 'info section-gap' }, 'Importando… 0 / ' + (jobs.length + dels.length));
  area.replaceChildren(prog);
  UI.editing = true;
  let done = 0;
  try {
    const queue = jobs.map(j => () => writeDoc(...j)).concat(dels.map(([c, id]) => () => deleteDoc(c, id)));
    const worker = async () => { while (queue.length) { const f = queue.shift(); await f(); done++; prog.textContent = `Importando… ${done} / ${jobs.length + dels.length}`; } };
    await Promise.all([worker(), worker(), worker()]);
    UI.editing = false; toast('Datos importados'); rebuild();
  } catch (e) { console.error(e); UI.editing = false; prog.className = 'confirm section-gap'; prog.textContent = errText(e) + ` (${done} guardados). Vuelve a importar para completar.`; }
}

/* ================= mejoras 2: bienestar, ausencias, minutos, convocatoria, informe ================= */
const WELL_ITEMS = [['sueno', 'Sueño'], ['fatiga', 'Fatiga'], ['estres', 'Estrés'], ['dolor', 'Dolor musc.']];
const AUS_REASONS = ['Lesión', 'Enfermedad', 'Estudios', 'Trabajo', 'Motivo personal', 'Sin justificar'];
const hooperOf = w => w && WELL_ITEMS.every(([k]) => w[k] != null) ? WELL_ITEMS.reduce((t, [k]) => t + w[k], 0) : null;

function enrichModel2(M) {
  const cfg = M.cfg;
  cfg.hooper = cfg.hooper ?? 18;
  const nameOf = Object.fromEntries(M.players.map(p => [p.id, p.name]));
  M.wellBy = {}; // name -> [{date, h, items}]
  M.ausBy = {};  // name -> [{date, reason}]
  for (const s of M.sessions) {
    s.well = {}; s.aus = {};
    for (const [pid, w] of Object.entries(s.doc.well || {})) {
      const n = nameOf[pid]; if (!n) continue;
      const hv = hooperOf(w); s.well[n] = { ...w, h: hv };
      if (hv != null) (M.wellBy[n] = M.wellBy[n] || []).push({ date: s.date, h: hv, w, week: s.week });
    }
    for (const p of M.players) {
      if (s.rpe[p.name] != null || s.tipo === 'Partido') continue;
      let r = (s.doc.aus || {})[p.id] || '';
      if (!r && injuredOn(M, p.name, s.date)) r = 'Lesión';
      if (r) { s.aus[p.name] = r; (M.ausBy[p.name] = M.ausBy[p.name] || []).push({ date: s.date, reason: r }); }
    }
    const hs = Object.values(s.well).map(x => x.h).filter(v => v != null);
    s.hooperAvg = mean(hs);
  }
  for (const p of M.players) for (const x of (M.pw[p.name] || [])) {
    const hs = (M.wellBy[p.name] || []).filter(e => e.week === x.w).map(e => e.h); x.hooper = mean(hs);
  }
  M.tw.forEach(x => { x.hooper = mean(M.sessions.filter(s => s.week === x.w && s.hooperAvg != null).map(s => s.hooperAvg)); });
  // stats: ausencias
  const entr = M.sessions.filter(s => s.tipo !== 'Partido');
  M.stats.forEach(st => {
    const n = st.p.name, missed = entr.filter(s => s.rpe[n] == null);
    st.ausJ = missed.filter(s => s.aus[n] && s.aus[n] !== 'Sin justificar').length;
    st.ausI = missed.filter(s => s.aus[n] === 'Sin justificar').length;
    st.ausN = missed.filter(s => !s.aus[n]).length;
    const wl = M.wellBy[n] || []; st.hooperLast = wl.length ? wl[wl.length - 1] : null;
    // minutos por demarcación (titular)
    st.dems = {}; M.actas.filter(a => a.name === n && a.tit).forEach(a => { const d = a.dem || st.p.pos || '?'; st.dems[d] = (st.dems[d] || 0) + 1; });
    const A = M.actas.filter(a => a.name === n);
    st.minTit = A.filter(a => a.tit).reduce((t, a) => t + (a.stints[0] ? a.stints[0][1] - a.stints[0][0] : 0), 0);
    st.minSub = st.min - st.minTit;
  });
  // sanciones: tras el partido j, roja => sancionado en j+1; alcanzar múltiplo del ciclo => sancionado en j+1
  M.suspended = {}; // j -> Set(names)
  const cum = {};
  M.matches.filter(m => m.played).forEach(m => {
    const next = M.matches.find(x => x.j > m.j); if (!next) return;
    M.actas.filter(a => a.j === m.j).forEach(a => {
      const before = cum[a.name] || 0, after = before + (a.ya || 0); cum[a.name] = after;
      if (a.rc || Math.floor(after / cfg.cycle) > Math.floor(before / cfg.cycle)) (M.suspended[next.j] = M.suspended[next.j] || new Set()).add(a.name);
    });
  });
  // alertas extra
  const extra = [];
  for (const p of M.players) {
    if (p.estado === 'Baja' || p.injury) continue;
    const wl = M.wellBy[p.name] || [];
    const last = wl[wl.length - 1], prev = wl[wl.length - 2];
    const lastSes = M.sessions.length ? M.sessions[M.sessions.length - 1].date : 0;
    if (last && lastSes - last.date <= 7) {
      if (last.h >= cfg.hooper && prev && prev.h >= cfg.hooper) extra.push({ sev: 3, p, t: 'Bienestar bajo', d: `Hooper ${last.h} y ${prev.h} en las dos últimas tomas` });
      else if (last.h >= cfg.hooper) extra.push({ sev: 2, p, t: 'Bienestar bajo', d: `Hooper ${last.h} el ${ddmm(last.date)}` });
      const bad = WELL_ITEMS.filter(([k]) => last.w[k] >= 6);

  } catch (e) { console.error(e); if (!e || e.code !== 'declined') toast('No se pudo crear la copia', true); }
}
function parseBackupText(txt) {
  let o = null;
  const t = txt.trim();
  if (t.startsWith('{')) o = JSON.parse(t);
  else { const m = t.match(/<script type="application\/json" id="snap">([\s\S]*?)<\/script>/); if (m) o = JSON.parse(m[1]); }
  if (!o || !(o.docs || o.teams)) throw new Error('El archivo no contiene datos de My Team');
  const teams = o.teams && o.teams.length ? o.teams : [{ id: 'main', docs: o.docs }];
  return teams.filter(x => x && x.docs);
}
async function importBackup(file, onProgress) {
  const teams = parseBackupText(await file.text());
  const db = store.db; if (!db) throw new Error('Sin base de datos');
  const jobs = [];
  // borrar todo lo actual
  const existing = ['main', ...[...store.teams.keys()].filter(k => k !== 'main')];
  for (const tid of existing) for (const c of COLS) { const snap = await colRef(c, tid).get(); snap.docs.forEach(d => jobs.push(() => colRef(c, tid).doc(d.id).delete())); }
  { const snap = await db.collection('teamlist').get(); snap.docs.forEach(d => jobs.push(() => db.collection('teamlist').doc(d.id).delete())); }
  for (const t of teams) {
    const D = t.docs, tid = t.id || 'main';
    for (const c of COLS) {
      if (c === 'config' || c === 'table') { if (D[c]) jobs.push(() => colRef(c, tid).doc('main').set(clean(D[c]))); continue; }
      for (const d of (D[c] || [])) { const { id, ...b } = d; if (id) jobs.push(() => colRef(c, tid).doc(id).set(clean(b))); }
    }
    if (D.meta) jobs.push(() => db.collection('teamlist').doc(tid).set(clean({ name: D.meta.name, cat: D.meta.cat || 'F11', crest: D.meta.crest || null, color: D.meta.color || DEFAULT_COLOR })));
  }
  let n = 0; for (const j of jobs) { await j(); n++; if (onProgress && n % 20 === 0) onProgress(n, jobs.length); }
  return teams.length;
}
function pickBackupFile(btn) {
  const inp = h('input', { type: 'file', accept: '.json,.html,.htm,application/json,text/html', hidden: true });
  document.body.append(inp);
  inp.addEventListener('change', async () => {
    const f = inp.files[0]; inp.remove(); if (!f) return;
    const txt = btn ? btn.textContent : '';
    try {
      if (btn) btn.disabled = true; UI.editing = true;
      const n = await importBackup(f, (i, t) => { if (btn) btn.textContent = `Importando ${i}/${t}…`; });
      store.team = 'main'; lsSet('myteam-team', 'main');
      toast(n > 1 ? `Importados ${n} equipos` : 'Datos importados');
    } catch (e) { console.error(e); toast(e.message || 'No se pudo importar', true); }
    if (btn) { btn.disabled = false; btn.textContent = txt; }
    UI.editing = false; subscribeTeam();
  });
  inp.click();
}

async function loadDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const names = [['Hugo', 'POR'], ['Dani', 'POR'], ['Álex', 'LD'], ['Iker', 'DFC'], ['Pablo', 'DFC'], ['Rubén', 'DFC'], ['Marc', 'LI'], ['Javi', 'LD'], ['Sergio', 'MCD'], ['Adrián', 'MC'], ['Nico', 'MC'], ['Leo', 'MCO'], ['Mateo', 'ED'], ['Izan', 'EI'], ['Lucas', 'DC'], ['Bruno', 'DC'], ['Unai', 'EI'], ['Gonzalo', 'MC']];
  const players = names.map(([n, pos], i) => ({ id: 'p' + pad2(i), i, name: n, ap: '', dorsal: i === 1 ? 13 : i + 1 - (i > 1 ? 1 : 0), pos, estado: 'Activo', fcmax: null, fcrest: null, prev: { goals: 0, ast: 0, ya: 0, rc: 0, gc: 0 } }));
  const today = todaySerial(), dow0 = (sdate(today).getUTCDay() + 6) % 7;
  const start = today - dow0 - 28; // lunes de hace 4 semanas
  const name = 'Equipo de ejemplo';
  const rivals = ['C.D. Atlético Norte', 'U.D. Los Pinos', 'E.F. Río Verde', 'C.F. San Roque', 'A.D. Las Lomas', 'C.D. Puerto Sur', 'U.D. Villanueva'];
  const sessions = [], matches = [];
  const XI = [0, 2, 3, 4, 6, 8, 9, 11, 12, 13, 14], BENCH = [1, 5, 7, 10, 15, 16, 17];
  for (let w = 0; w < 4; w++) {
    const mon = start + 7 * w;
    [[0, 'MD+1', 60, [2, 4], 'Recuperación activa · Rondos · Movilidad'], [2, 'MD-4', 90, [6, 8], 'Calentamiento · Fuerza + sprints · Posesión 8x8 · Partido condicionado'], [4, 'MD-2', 75, [4, 6], 'Activación · Salida de balón · ABP · Partido 9x9']].forEach(([d, md, dur, [lo, hi], content]) => {
      const rpe = {}; players.forEach(p => { if (rnd() > .1) rpe[p.id] = pick(lo, hi); });
      sessions.push({ id: 's' + (mon + d) + '-1', date: mon + d, dur, md, content, fc: {}, rpe });
    });
    const j = w + 1, mdate = mon + 6, gf1 = pick(0, 2), gf2 = pick(1, 2), gc1 = pick(0, 1), gc2 = pick(0, 1);
    const scorers = []; for (let g = 0; g < gf1 + gf2; g++) scorers.push(XI[pick(6, 10)]);
    const subsOut = [XI[pick(7, 10)], XI[pick(4, 6)], XI[pick(1, 3)]].filter((v, k, a) => a.indexOf(v) === k);
    const subsIn = BENCH.slice(1).sort(() => rnd() - .5).slice(0, subsOut.length);
    const acta = [];
    XI.forEach((pi, k) => acta.push({ pid: players[pi].id, tit: true, dem: players[pi].pos, s: subsOut.includes(pi) ? 60 + 10 * subsOut.indexOf(pi) : null, e: null, re: null, rs: null, goals: scorers.filter(x => x === pi).length, ast: 0, ya: rnd() > .85 ? 1 : 0, rc: 0, gc: pi === 0 ? gc1 + gc2 : 0, val: null, notes: '' }));
    subsIn.forEach((pi, k) => acta.push({ pid: players[pi].id, tit: false, dem: '', s: null, e: 60 + 10 * k, re: null, rs: null, goals: 0, ast: 0, ya: 0, rc: 0, gc: 0, val: null, notes: '' }));
    matches.push({ id: 'j' + pad2(j), j, date: mdate, rival: rivals[w], campo: j % 2 ? 'Visitante' : 'Local', dur: 90, gf1, gf2, gc1, gc2, tf1: pick(3, 8), tf2: pick(3, 8), tc1: pick(2, 6), tc2: pick(2, 6), tabla: null, obs: '', acta });
    const rpe = {}; acta.forEach(a => { rpe[a.pid] = pick(7, 9); });
    sessions.push({ id: 's' + mdate + '-1', date: mdate, dur: 90, md: 'MD', content: '', fc: {}, rpe });
  }
  for (let j = 5; j <= 7; j++) matches.push({ id: 'j' + pad2(j), j, date: start + 7 * (j - 1) + 6, rival: rivals[j - 1], campo: j % 2 ? 'Visitante' : 'Local', dur: 90, gf1: null, gf2: null, gc1: null, gc2: null, tf1: null, tf2: null, tc1: null, tc2: null, tabla: null, obs: '', acta: [] });
  const D = { config: { ...DEFAULT_CFG, team: name, start, dur: 90, compMin: 45, hooper: 18, missStreak: 3, acwrMode: 'ewma', trainDays: [0, 2, 4], lineOf: { ...DEFAULT_LINE } },
    table: { rows: [{ t: name, us: true }, ...rivals.map(t => ({ t, us: false }))], baseJ: 0 },
    players, sessions, matches, injuries: [], tests: [], plan: [], league: [], objectives: [] };
  for (const c of COLS) {
    if (c === 'config' || c === 'table') { await colRef(c).doc('main').set(clean(D[c])); continue; }
    for (const d of D[c]) { const { id, ...b } = d; await colRef(c).doc(id).set(clean(b)); }
  }
  await store.db.collection('teamlist').doc('main').set(clean({ name, cat: 'F11', crest: null, color: '#0f766e' }));
}

/* ================= boot ================= */
(async function boot() {
  route();
  const pdb = window.claude?.use ? window.claude.use('db') : Promise.resolve(null);
  const puser = window.claude?.use ? window.claude.use('user') : Promise.resolve(null);
  const [db, user] = await Promise.all([pdb, puser]);
  store.db = db;
  if (!db) {
    if (SNAP && SNAP.docs) {
      store.snapTeams = SNAP.teams && SNAP.teams.length ? SNAP.teams : [{ id: 'main', docs: SNAP.docs }];
      if (!store.snapTeams.some(t => t.id === store.team)) store.team = store.snapTeams[0].id;
      store.local = store.snapTeams.find(t => t.id === store.team).docs; store.fromSnap = true;
    }
    store.ready = true; rebuild();
    if (!store.fromSnap) toast('Abre esta página en Claude para ver los datos guardados.');
    return;
  }
  store.canWrite = true;
  if (user) {
    try { store.isAdmin = !!(await user.canEdit()); } catch (_) {}
    try { const c = await user.can('data.write'); if (c === false) { store.canWrite = false; store.canWriteKnown = true; } else if (c === true) store.canWriteKnown = true; } catch (_) {}
  }
  let firstList = true;
  db.collection('teamlist').onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => { if (d.exists) m.set(d.id, d.data()); });
    store.teams = m;
    if (firstList) { firstList = false; if (store.team !== 'main' && !m.has(store.team)) { store.team = 'main'; } subscribeTeam(); }
    else if (store.team !== 'main' && !m.has(store.team)) { switchTeam('main'); return; }
    applyTheme(teamMeta()); renderTeamSwitch(); if (store.ready) rebuild();
  }, err => { console.error('teamlist', err); if (firstList) { firstList = false; subscribeTeam(); } });
})();
