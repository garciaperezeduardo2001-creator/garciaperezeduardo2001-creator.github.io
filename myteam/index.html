<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#15803d"><meta name="description" content="Control de carga, minutos y rendimiento para preparadores físicos de fútbol."><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>My Team</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sticky scoreboard-style header with tab bar; one working view at a time; the pitch is the visual centrepiece of Partidos. */
:root {
  --bg: #f4f6f3;
  --panel: #ffffff;
  --ink: #12201a;
  --ink-2: #4a5a52;
  --ink-3: #7b8a82;
  --line: #dde4df;
  --line-2: #eef2ef;
  --accent: #15803d;          /* chalkboard navy: UI accent */
  --accent-soft: #e3f4e8;
  --bar: #2a78d6;             /* series 1 */
  --bar-hi: #1b5fb0;
  --grass-1: #2f7d4a;
  --grass-2: #2a7243;
  --chalk: rgba(255,255,255,.82);
  --z-low: #6f8fb0;           /* status: carga baja */
  --z-ok: #1f9d55;            /* status: óptimo */
  --z-warn: #d48a00;          /* status: precaución */
  --z-bad: #d23c3c;           /* status: riesgo */
  --z-low-bg: #e7eef6; --z-ok-bg: #e2f4e9; --z-warn-bg: #fbf0d9; --z-bad-bg: #fbe4e4;
  --win: #1f9d55; --draw: #d48a00; --loss: #d23c3c;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1613; --panel: #16201b; --ink: #e8efe9; --ink-2: #b2c0b7; --ink-3: #82938a; --line: #26332c; --line-2: #1c2721;
  --accent: #4ade80; --accent-soft: #163a24; --bar: #3987e5; --bar-hi: #66a3ee; --grass-1: #1f5a34; --grass-2: #1b5130; --chalk: rgba(255,255,255,.7);
  --z-low: #86a6c8; --z-ok: #3cb872; --z-warn: #e3a12a; --z-bad: #ec6464;
  --z-low-bg: #1d2a38; --z-ok-bg: #16301f; --z-warn-bg: #36290c; --z-bad-bg: #3a1a1a;
  --win: #3cb872; --draw: #e3a12a; --loss: #ec6464; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1613; --panel: #16201b; --ink: #e8efe9; --ink-2: #b2c0b7; --ink-3: #82938a; --line: #26332c; --line-2: #1c2721;
  --accent: #4ade80; --accent-soft: #163a24; --bar: #3987e5; --bar-hi: #66a3ee; --grass-1: #1f5a34; --grass-2: #1b5130; --chalk: rgba(255,255,255,.7);
  --z-low: #86a6c8; --z-ok: #3cb872; --z-warn: #e3a12a; --z-bad: #ec6464;
  --z-low-bg: #1d2a38; --z-ok-bg: #16301f; --z-warn-bg: #36290c; --z-bad-bg: #3a1a1a;
  --win: #3cb872; --draw: #e3a12a; --loss: #ec6464; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 12px 6px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.7rem; letter-spacing: .01em; margin: 0; line-height: 1; text-transform: uppercase; }
.brand h1 small { display: block; font-family: var(--body); font-weight: 500; font-size: .78rem; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.datasrc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .8rem; color: var(--ink-3); }
.btn { font: 600 .85rem var(--body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent, var(--panel)); }
.btn.primary:hover { filter: brightness(1.1); color: var(--on-accent, var(--panel)); }
.btn:focus-visible, select:focus-visible, .tab:focus-visible, .chip:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { font: 700 .95rem var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding: 10px 12px 9px; border-bottom: 3px solid transparent; text-decoration: none; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
main { padding-block: 20px 48px; }
.view-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; text-transform: uppercase; letter-spacing: .02em; margin: 0; line-height: 1.1; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 700; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; color: var(--ink-2); }
.sub { color: var(--ink-3); font-size: .85rem; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.kpi .l { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.kpi .v { font-family: var(--display); font-weight: 700; font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: .9rem; color: var(--ink-3); font-weight: 600; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .88rem; }
th { font: 600 .7rem var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { all: unset; cursor: pointer; }
th button:hover { color: var(--ink); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line-2); text-align: right; white-space: nowrap; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tbody tr:hover td { background: var(--line-2); }
td.name { font-weight: 600; }
.muted { color: var(--ink-3); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: .75rem; font-weight: 700; letter-spacing: .02em; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.z-low { color: var(--z-low); background: var(--z-low-bg); }
.z-ok { color: var(--z-ok); background: var(--z-ok-bg); }
.z-warn { color: var(--z-warn); background: var(--z-warn-bg); }
.z-bad { color: var(--z-bad); background: var(--z-bad-bg); }
.z-none { color: var(--ink-3); background: var(--line-2); }
.res { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; color: var(--panel); font: 700 .8rem var(--display); }
.res.V { background: var(--win); } .res.E { background: var(--draw); } .res.D { background: var(--loss); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select { font: 600 .9rem var(--body); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: none; display: grid; justify-items: center; gap: 2px; min-width: 64px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); cursor: pointer; font: inherit; color: var(--ink); }
.chip .j { font: 700 .8rem var(--display); letter-spacing: .05em; color: var(--ink-3); }
.chip .sc { font: 700 1.05rem var(--display); font-variant-numeric: tabular-nums; }
.chip.dis { opacity: .55; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.chip .bar.V { background: var(--win); } .chip .bar.E { background: var(--draw); } .chip .bar.D { background: var(--loss); }

/* Scoreboard */
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 16px; }
.scoreboard .team { font: 700 1.25rem var(--display); text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }
.scoreboard .team.r { text-align: right; }
.scoreboard .team.us { color: var(--accent); }
.scoreboard .score { font: 800 2.6rem var(--display); font-variant-numeric: tabular-nums; padding: 0 14px; border-radius: 10px; background: var(--line-2); line-height: 1.25; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; color: var(--ink-3); font-size: .85rem; padding-bottom: 12px; }
.halves { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 0; font-variant-numeric: tabular-nums; font-size: .88rem; }
.halves div { padding: 6px 8px; border-bottom: 1px solid var(--line-2); text-align: right; }
.halves div.h { font-size: .7rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.halves div.k { text-align: left; color: var(--ink-2); }

/* Pitch */
.matchgrid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .matchgrid { grid-template-columns: 1fr; } }
.pitch { position: relative; width: 100%; max-width: 100%; aspect-ratio: 68 / 92; border-radius: 12px; overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--grass-1) 0 9.09%, var(--grass-2) 9.09% 18.18%); }
.pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.pl { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; width: 84px; text-align: center; }
.pl .shirt { position: relative; width: 38px; height: 38px; border-radius: 50%; background: #ffffff; color: #12201a; display: grid; place-items: center; font: 800 1rem var(--display); box-shadow: 0 2px 6px rgba(0,0,0,.35); border: 2px solid #12201a; }
.pl.gk .shirt { background: #f2c230; }
.pl .nm { font: 700 .82rem var(--display); color: #ffffff; letter-spacing: .03em; text-transform: uppercase; text-shadow: 0 1px 3px rgba(0,0,0,.6); line-height: 1.05; }
.pl .mn { font: 600 .7rem var(--body); color: rgba(255,255,255,.85); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.pl .ev { position: absolute; top: -6px; right: -16px; font: 700 .66rem var(--body); padding: 1px 4px; border-radius: 5px; background: #ffffff; color: #b42525; box-shadow: 0 1px 3px rgba(0,0,0,.3); white-space: nowrap; }
.pl .ev.g { right: auto; left: -16px; color: #12201a; }
.pitch .pos { font: 600 .6rem var(--body); color: rgba(255,255,255,.65); letter-spacing: .06em; }
.legendrow { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--ink-3); margin-top: 8px; }
.sw { display: inline-block; width: 12px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

/* Minutes timeline */
.tl { display: grid; grid-template-columns: 96px minmax(0,1fr) 40px; gap: 4px 8px; align-items: center; font-size: .82rem; }
.tl .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl .who small { color: var(--ink-3); font-weight: 500; }
.tl .track { position: relative; height: 14px; background: var(--line-2); border-radius: 3px; }
.tl .seg { position: absolute; top: 0; bottom: 0; background: var(--bar); border-radius: 3px; }
.tl .seg.sub { background: var(--z-ok); }
.tl .min { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 600; }
.tl .axis { position: relative; height: 16px; font-size: .68rem; color: var(--ink-3); }
.tl .axis span { position: absolute; transform: translateX(-50%); }
.tl .half { position: absolute; top: -2px; bottom: -2px; left: 50%; width: 1px; background: var(--ink-3); opacity: .5; }

.subs { display: grid; gap: 4px; font-size: .86rem; }
.subs div { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line-2); }
.subs .m { font: 700 .95rem var(--display); color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.in { color: var(--z-ok); font-weight: 700; } .out { color: var(--z-bad); font-weight: 700; }
.cron { white-space: pre-wrap; color: var(--ink-2); font-size: .88rem; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font: 500 11px var(--body); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--bar); }
.chart .bar:hover, .chart .bar.hot { fill: var(--bar-hi); }
.chart .mline { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: .8rem; box-shadow: 0 6px 18px rgba(0,0,0,.14); min-width: 110px; }
.tip b { font: 700 1.05rem var(--display); display: block; font-variant-numeric: tabular-nums; }
.gauge { position: relative; width: 120px; height: 10px; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; background: var(--line-2); }
.gauge i { position: absolute; top: 0; bottom: 0; }
.gauge b { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 1px; }
.minibar { display: inline-block; height: 8px; border-radius: 2px; background: var(--bar); vertical-align: middle; }
.note { font-size: .8rem; color: var(--ink-3); margin-top: 8px; }
.empty { padding: 28px; text-align: center; color: var(--ink-3); }
.flash { font-size: .8rem; padding: 4px 9px; border-radius: 6px; background: var(--z-ok-bg); color: var(--z-ok); font-weight: 600; }
.flash.err { background: var(--z-bad-bg); color: var(--z-bad); }
.alerts { display: grid; gap: 6px; }
.alerts div { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
@media (prefers-reduced-motion: no-preference) { .pl { transition: left .35s ease, top .35s ease; } }
@media (max-width: 520px) {
  .pl { width: 70px; } .pl .shirt { width: 30px; height: 30px; font-size: .85rem; } .pl .nm { font-size: .7rem; } .pl .mn { display: none; }
  .scoreboard .score { font-size: 2rem; } .scoreboard .team { font-size: 1rem; }
  .tl { grid-template-columns: 76px minmax(0,1fr) 34px; }
}

/* --- editing --- */
input[type=number], input[type=text], input[type=date], textarea, select.f { font: 500 .9rem var(--body); padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); min-width: 0; }
input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=number] { font-variant-numeric: tabular-nums; }
input.n { width: 62px; text-align: center; }
input.n.s { width: 52px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
textarea { width: 100%; resize: vertical; min-height: 64px; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
.formgrid .wide { grid-column: 1 / -1; }
label.f { display: grid; gap: 4px; font-size: .72rem; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; min-width: 0; }
label.f > * { text-transform: none; letter-spacing: 0; }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.btn.danger { color: var(--z-bad); border-color: var(--z-bad-bg); }
.btn.danger:hover { border-color: var(--z-bad); color: var(--z-bad); }
.btn.sm { padding: 4px 9px; font-size: .78rem; }
.btn:disabled { opacity: .5; cursor: default; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-radius: 8px; background: var(--z-bad-bg); color: var(--z-bad); font-weight: 600; font-size: .85rem; }
.info { padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: .85rem; font-weight: 600; }
.warnbox { padding: 8px 12px; border-radius: 8px; background: var(--z-warn-bg); color: var(--z-warn); font-size: .85rem; font-weight: 600; }
tr.off td { opacity: .55; }
tr.off td:first-child, tr.off td.keep { opacity: 1; }
td input[type=number], td input[type=text], td select.f { padding: 4px 6px; font-size: .85rem; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 9px; font-weight: 600; font-size: .88rem; box-shadow: 0 8px 22px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
.toast.err { background: var(--z-bad); color: #fff; }
.rpecell { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.loadprev { min-width: 44px; color: var(--ink-3); font-size: .78rem; font-variant-numeric: tabular-nums; }
.section-gap { margin-top: 14px; }
.headbtns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status { font-size: .78rem; color: var(--ink-3); }
.status b { color: var(--z-ok); }
input.n.xs { width: 42px; padding-inline: 4px; }
td select.f { max-width: 140px; }
.brandid { display: flex; align-items: center; gap: 12px; min-width: 0; }
.crest { width: 52px; height: 52px; border-radius: 12px; flex: none; object-fit: cover; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
@media (max-width: 520px) { .crest { width: 42px; height: 42px; border-radius: 10px; } }
.stick-r { position: sticky; right: 0; background: var(--panel); box-shadow: -8px 0 8px -8px rgba(0,0,0,.18); }
tbody tr:hover td.stick-r { background: var(--line-2); }
.pitch.court { background: linear-gradient(180deg, #2f6db3 0 18%, #3a7cc4 18% 82%, #2f6db3 82%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pitch.court { background: linear-gradient(180deg, #1f4f86 0 18%, #285c96 18% 82%, #1f4f86 82%); } }
.tablewrap table td:first-child, .tablewrap table th:first-child { position: sticky; left: 0; z-index: 1; background: var(--panel); }
tbody tr:hover td:first-child { background: var(--line-2); }
tr.delrow td:first-child { position: static; }

/* ===== Tema "banquillo técnico": una sola familia (Archivo) en dos anchos, frases en minúscula,
   superficies tranquilas y el color del equipo como único acento. Lo memorable: las cifras,
   en Archivo estrecho y tabular, como en un marcador. ===== */
@font-face { font-family: "Archivo"; src: url("archivo.woff") format("woff"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root {
  --display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --body: "Archivo", "Segoe UI", system-ui, sans-serif;
  --bg: #f0f2f1; --line: #dde3df; --line-2: #edf0ee; --ink: #101a15; --ink-2: #3f4d46; --ink-3: #6b7972;
  --r: 14px; --r-s: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1411; --panel: #141d19; --line: #24302a; --line-2: #1a241f; } }
:root[data-theme="dark"] { --bg: #0d1411; --panel: #141d19; --line: #24302a; --line-2: #1a241f; }

body { font-family: var(--body); font-size: 15px; line-height: 1.5; letter-spacing: -.003em; -webkit-font-smoothing: antialiased; font-variant-numeric: lining-nums; }

/* cabecera */
header.top { box-shadow: none; }
.brand { padding-block: 14px 8px; }
.brand h1 { font: 700 1.3rem/1.15 var(--display); letter-spacing: -.02em; text-transform: none; }
.brand h1 small { font: 500 .82rem/1.3 var(--body); letter-spacing: 0; text-transform: none; color: var(--ink-3); margin-top: 3px; }
nav.tabs { gap: 4px; }
.tab { font: 600 .9rem var(--body); letter-spacing: -.005em; text-transform: none; padding: 12px 12px 11px; border-bottom-width: 2px; }

/* títulos */
h2 { font: 700 1.6rem/1.15 var(--display); letter-spacing: -.025em; text-transform: none; }
h3 { font: 650 1.02rem/1.3 var(--body); letter-spacing: -.01em; text-transform: none; color: var(--ink); margin-bottom: 12px; }
.view-head { margin-bottom: 18px; }
.view-head .sub { margin-top: 4px; max-width: 70ch; }
.sub { font-size: .875rem; line-height: 1.45; }
main { padding-block: 24px 56px; }

/* superficies */
.panel { border-radius: var(--r); padding: 18px 18px 16px; }
.grid { gap: 16px; }
.info, .warnbox { border-radius: var(--r-s); padding: 10px 14px; font-weight: 500; line-height: 1.45; }

/* cifras: el elemento con carácter */
.kpis { gap: 10px; margin-bottom: 16px; }
.kpi { border-radius: 12px; padding: 12px 14px 11px; display: flex; flex-direction: column; gap: 2px; }
.kpi .l { font: 500 .8rem/1.3 var(--body); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.kpi .v { font-family: var(--display); font-weight: 760; font-stretch: 70%; font-size: 2.15rem; line-height: 1.05; letter-spacing: -.01em; font-variant-numeric: tabular-nums lining-nums; }
.kpi .v small { font-family: var(--body); font-stretch: 100%; font-size: .82rem; font-weight: 500; letter-spacing: 0; }

/* tablas */
table { font-size: .875rem; }
th { font: 600 .76rem var(--body); letter-spacing: 0; text-transform: none; color: var(--ink-3); padding: 8px 8px 7px; }
td { padding: 8px 8px; }
td.name { font-weight: 600; }
tbody tr:hover td { background: color-mix(in srgb, var(--accent) 5%, var(--panel)); }

/* controles */
.btn { font: 600 .875rem/1.2 var(--body); padding: 8px 14px; border-radius: var(--r-s); min-height: 38px; letter-spacing: -.005em; }
.btn.sm { font-size: .8rem; padding: 5px 10px; min-height: 32px; border-radius: 8px; }
select { font: 500 .875rem var(--body); border-radius: var(--r-s); padding: 8px 10px; }
input[type=number], input[type=text], input[type=date], input[type=tel], textarea, select.f { font-family: var(--body); border-radius: 8px; }
label.f { font-size: .8rem; font-weight: 500; letter-spacing: 0; text-transform: none; }
.pill { font-weight: 650; letter-spacing: 0; }

/* fútbol: marcador, jornadas y campo (aquí sí, mayúsculas de grafismo televisivo) */
.chip { border-radius: var(--r-s); }
.chip .j { font: 600 .78rem var(--body); letter-spacing: 0; }
.chip .sc, .res { font-family: var(--display); font-stretch: 72%; font-weight: 760; }
.scoreboard .team { font-family: var(--display); font-weight: 760; font-stretch: 78%; font-size: 1.35rem; letter-spacing: .005em; }
.scoreboard .score { font-family: var(--display); font-weight: 800; font-stretch: 66%; font-size: 3rem; letter-spacing: .01em; }
.halves div.h { font: 600 .76rem var(--body); letter-spacing: 0; text-transform: none; }
.pl .nm { font-family: var(--display); font-weight: 700; font-stretch: 75%; font-size: .84rem; letter-spacing: .02em; }
.pl .shirt, .pl .shirt.kit .kn { font-family: var(--display); font-stretch: 75%; font-weight: 800; }
.pitch .pos { font-family: var(--body); font-weight: 600; }
.legendrow { font-size: .8rem; }
.empty h2 { font-size: 1.4rem; }

a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }

/* nombres largos de rival: el marcador nunca se parte */
.scoreboard { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
.scoreboard .team { min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.scoreboard .score, .chip .sc, .res, .rs-it b, .md-cd b, .kpi .v { white-space: nowrap; }
@media (max-width: 640px) { .scoreboard { gap: 8px; padding: 14px 10px; } .scoreboard .team { font-size: 1.05rem; } .scoreboard .score { font-size: 2.4rem; padding: 0 10px; } }

<script>
/* Vestuario app: base de datos local (IndexedDB, con respaldo en localStorage) con la misma interfaz que la de Claude */
(function () {
  window.__APP = true; window.__MYTEAM = true;
  const mem = {};            // ruta de colección -> { id: datos }
  const listeners = {};      // ruta -> [fn]
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
  let idb = null;
  const LS = 'myteam:';
  const ready = new Promise(resolve => {
    const fromLS = () => { try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(LS)) mem[k.slice(LS.length)] = JSON.parse(localStorage.getItem(k)); } } catch (_) {} };
    let req;
    try { req = indexedDB.open('myteam', 1); } catch (_) { fromLS(); resolve(); return; }
    req.onupgradeneeded = () => req.result.createObjectStore('cols');
    req.onerror = () => { fromLS(); resolve(); };
    req.onsuccess = () => {
      idb = req.result;
      const tx = idb.transaction('cols', 'readonly'), st = tx.objectStore('cols');
      const cur = st.openCursor();
      cur.onsuccess = () => { const c = cur.result; if (c) { mem[c.key] = c.value; c.continue(); } else resolve(); };
      cur.onerror = () => { fromLS(); resolve(); };
    };
  });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}
  const persist = path => new Promise((ok, ko) => {
    const val = mem[path] || {};
    if (idb) {
      const tx = idb.transaction('cols', 'readwrite');
      tx.objectStore('cols').put(val, path);
      tx.oncomplete = () => ok(); tx.onerror = () => ko({ code: 'quota_exceeded', message: 'No hay espacio en el móvil' });
    } else { try { localStorage.setItem(LS + path, JSON.stringify(val)); ok(); } catch (e) { ko({ code: 'quota_exceeded', message: 'No hay espacio en el móvil' }); } }
  });
  const snap = path => ({ docs: Object.entries(mem[path] || {}).map(([id, b]) => ({ id, exists: true, data: () => clone(b) })) });
  const notify = path => (listeners[path] || []).slice().forEach(fn => { try { fn(snap(path)); } catch (e) { console.error(e); } });
  const docRef = (path, id) => ({
    id,
    async get() { await ready; const b = (mem[path] || {})[id]; return { id, exists: b !== undefined, data: () => clone(b) }; },
    async set(b) { await ready; (mem[path] = mem[path] || {})[id] = clone(b); await persist(path); notify(path); },
    async delete() { await ready; if (mem[path]) { delete mem[path][id]; await persist(path); } notify(path); }
  });
  const db = {
    collection: path => ({
      onSnapshot(next) {
        const L = (listeners[path] = listeners[path] || []); L.push(next);
        ready.then(() => { if (L.includes(next)) next(snap(path)); });
        return () => { const i = L.indexOf(next); if (i >= 0) L.splice(i, 1); };
      },
      async get() { await ready; return snap(path); },
      doc: id => docRef(path, id)
    }),
    doc: p => { const i = p.lastIndexOf('/'); return docRef(p.slice(0, i), p.slice(i + 1)); }
  };
  const user = { canEdit: async () => false, can: async () => true, isOwner: async () => true };
  const downloads = {
    async save({ filename, data }) {
      const type = /\.json$/i.test(filename) ? 'application/json' : /\.html?$/i.test(filename) ? 'text/html' : /\.pdf$/i.test(filename) ? 'application/pdf' : /\.xlsx$/i.test(filename) ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : 'application/octet-stream';
      const blob = new Blob([data], { type });
      try {
        const file = new File([blob], filename, { type });
        if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
          await navigator.share({ files: [file], title: filename });
          return;
        }
      } catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' }; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }
  };
  window.claude = { use: async n => n === 'db' ? db : n === 'user' ? user : n === 'downloads' ? downloads : null };
  if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>

<script>/* My Team · vista del cuerpo técnico: ?ver=ID#k=CLAVE abre los datos compartidos (cifrados) en solo lectura */
(function () {
  const q = new URLSearchParams(location.search), id = q.get('ver');
  if (!id || !/^[A-Za-z0-9_-]{16,40}$/.test(id)) return;
  const hp = new URLSearchParams(location.hash.replace(/^#/, '').split('&').filter(x => /^(k|e)=/.test(x)).join('&'));
  const fk = hp.get('k') || sessionStorage.getItem('mt-ver-k-' + id);
  const fe = hp.get('e') || sessionStorage.getItem('mt-ver-e-' + id);
  if (hp.get('e')) sessionStorage.setItem('mt-ver-e-' + id, hp.get('e'));
  // quita las claves de la barra de direcciones (se quedan solo en esta pestaña)
  if (hp.get('k') || hp.get('e')) { try { sessionStorage.setItem('mt-ver-k-' + id, hp.get('k') || fk); history.replaceState(null, '', location.pathname + location.search + '#resumen'); } catch (_) {} }
  const CFG = window.NUBE_CFG || {};
  window.__VIEWER = { id, k: fk, e: /^[A-Za-z0-9_-]{20,40}$/.test(fe || '') ? fe : null };
  const KEY = 'mt-ver-' + id;
  const orig = window.claude && window.claude.use;
  let cached = null; try { cached = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (_) {}
  const b64d = s => { const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
  async function fetchSnap() {
    if (!CFG.apiKey || !CFG.projectId) throw new Error('cfg');
    if (!fk) throw new Error('key');
    sessionStorage.setItem('mt-ver-k-' + id, fk);
    const r = await fetch(`https://firestore.googleapis.com/v1/projects/${CFG.projectId}/databases/(default)/documents/compartido/${id}?key=${CFG.apiKey}&quotaUser=t${Date.now()}`, { cache: 'no-store' });
    if (r.status === 404) throw new Error('gone');
    if (!r.ok) throw new Error('http ' + r.status);
    const f = (await r.json()).fields || {};
    const raw = b64d(f.d.stringValue), iv = raw.slice(0, 12), ct = raw.slice(12);
    const key = await crypto.subtle.importKey('raw', b64d(fk), 'AES-GCM', false, ['decrypt']);
    const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const txt = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return { at: f.at && f.at.timestampValue, txt };
  }
  const shell = msg => {
    const d = document.createElement('div'); d.id = 'verLoad';
    d.style.cssText = 'position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#f4f6f3;font:600 16px system-ui,sans-serif;color:#24302a;text-align:center;padding:24px';
    d.textContent = msg; (document.body || document.documentElement).append(d); return d;
  };
  if (cached && cached.txt) {
    // datos ya descifrados: la app arranca en solo lectura con ellos
    const s = document.createElement('script'); s.type = 'application/json'; s.id = 'snap'; s.textContent = cached.txt.replace(/</g, '\\u003c');
    document.body.append(s);
    if (window.claude) window.claude.use = async n => n === 'db' ? null : n === 'downloads' && orig ? orig(n) : null;
    // comprueba de vez en cuando si el entrenador ha guardado cambios
    const check = async () => { try { const x = await fetchSnap(); if (x.at && x.at !== cached.at) { sessionStorage.setItem(KEY, JSON.stringify(x)); location.reload(); } } catch (e) { if (String(e.message) === 'gone') { sessionStorage.removeItem(KEY); location.reload(); } } };
    setInterval(() => { if (document.visibilityState === 'visible') check(); }, 120000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
    addEventListener('load', () => {
      const b = document.createElement('div'); b.className = 'ver-band';
      b.style.cssText = 'background:#163a24;color:#fff;font:600 13px system-ui,sans-serif;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;text-align:center';
      b.textContent = '👀 Vista del cuerpo técnico · solo lectura · se actualiza sola';
      document.body.prepend(b);
    });
    return;
  }
  // primera apertura: descarga, descifra y recarga
  if (window.claude) window.claude.use = () => new Promise(() => {});
  const box = shell('Cargando los datos del equipo…');
  fetchSnap().then(x => { sessionStorage.setItem(KEY, JSON.stringify(x)); location.reload(); })
    .catch(e => { const m = String(e.message);
      box.textContent = m === 'gone' ? 'Este enlace ya no está activo. Pide uno nuevo al entrenador.' : m === 'key' ? 'Al enlace le falta la clave. Ábrelo tal cual te lo enviaron, completo.' : m === 'cfg' ? 'La vista compartida aún no está disponible.' : 'No se han podido cargar los datos. Comprueba la conexión y vuelve a abrir el enlace.'; });

$('#fileIn').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let D;
    try { D = workbookToDocs(XLSX.read(new Uint8Array(rd.result), { type: 'array' })); }
    catch (err) { console.error(err); toast('No pude leer ese archivo: ' + err.message, true); e.target.value = ''; return; }
    e.target.value = '';
    if (!canEdit()) { store.local = D; rebuild(); toast('Mostrando ' + file.name + ' solo en este dispositivo'); return; }
    if (location.hash !== '#plantilla') { location.hash = 'plantilla'; }
    setTimeout(() => askImport(D, file.name), 120);
  };
  rd.readAsArrayBuffer(file);
});
function askImport(D, fname) {
  const area = vPlantilla.importArea || $('#main');
  const summary = `${D.players.length} jugadores, ${D.sessions.length} sesiones, ${D.matches.filter(m => m.gf1 != null || m.gc1 != null).length} partidos jugados` + (D.skipped ? ` (${D.skipped} filas sin jugador o sesión que se omiten)` : '');
  const hasAny = MODEL && hasData(MODEL.docs);
  area.replaceChildren(h('div', { class: hasAny ? 'confirm section-gap' : 'info section-gap', style: 'display:flex;gap:8px;flex-wrap:wrap;align-items:center' },
    h('span', null, `${fname}: ${summary}. ` + (hasAny ? 'Esto reemplazará todos los datos actuales de la página.' : '')),
    h('button', { class: 'btn sm primary', type: 'button', onclick: () => doImport(D, area) }, hasAny ? 'Reemplazar datos' : 'Importar'),
    h('button', { class: 'btn sm', type: 'button', onclick: () => area.replaceChildren() }, 'Cancelar')));
}
async function doImport(D, area) {
  const jobs = [['config', 'main', D.config], ['table', 'main', D.table]];
  D.players.forEach(({ id, ...b }) => jobs.push(['players', id, b]));
  D.sessions.forEach(({ id, ...b }) => jobs.push(['sessions', id, b]));
  D.matches.forEach(({ id, ...b }) => jobs.push(['matches', id, b]));
  const keep = { players: new Set(D.players.map(x => x.id)), sessions: new Set(D.sessions.map(x => x.id)), matches: new Set(D.matches.map(x => x.id)) };

    for (const [pid, w] of Object.entries(s.doc.well || {})) {
      const n = nameOf[pid]; if (!n) continue;
      const hv = hooperOf(w); s.well[n] = { ...w, h: hv };
      if (hv != null) (M.wellBy[n] = M.wellBy[n] || []).push({ date: s.date, h: hv, w, week: s.week });
    }
    for (const p of M.players) {
      if (s.rpe[p.name] != null || s.tipo === 'Partido') continue;
      let r = (s.doc.aus || {})[p.id] || '';
      if (!r && injuredOn(M, p.name, s.date)) r = 'Lesión';
      if (r) { s.aus[p.name] = r; (M.ausBy[p.name] = M.ausBy[p.name] || []).push({ date: s.date, reason: r }); }
    }
    const hs = Object.values(s.well).map(x => x.h).filter(v => v != null);
    s.hooperAvg = mean(hs);
  }
  for (const p of M.players) for (const x of (M.pw[p.name] || [])) {
    const hs = (M.wellBy[p.name] || []).filter(e => e.week === x.w).map(e => e.h); x.hooper = mean(hs);
  }
  M.tw.forEach(x => { x.hooper = mean(M.sessions.filter(s => s.week === x.w && s.hooperAvg != null).map(s => s.hooperAvg)); });
  // stats: ausencias

  M.stats.forEach(st => {

    st.ausJ = missed.filter(s => s.aus[n] && s.aus[n] !== 'Sin justificar').length;
    st.ausI = missed.filter(s => s.aus[n] === 'Sin justificar').length;
    st.ausN = missed.filter(s => !s.aus[n]).length;
    const wl = M.wellBy[n] || []; st.hooperLast = wl.length ? wl[wl.length - 1] : null;
    // minutos por demarcación (titular)
    st.dems = {}; M.actas.filter(a => a.name === n && a.tit).forEach(a => { const d = a.dem || st.p.pos || '?'; st.dems[d] = (st.dems[d] || 0) + 1; });
    const A = M.actas.filter(a => a.name === n);
    st.minTit = A.filter(a => a.tit).reduce((t, a) => t + (a.stints[0] ? a.stints[0][1] - a.stints[0][0] : 0), 0);
    st.minSub = st.min - st.minTit;
  });
  // sanciones: tras el partido j, roja => sancionado en j+1; alcanzar múltiplo del ciclo => sancionado en j+1
  M.suspended = {}; // j -> Set(names)
  const cum = {};
  M.matches.filter(m => m.played).forEach(m => {
    const next = M.matches.find(x => x.j > m.j); if (!next) return;
    M.actas.filter(a => a.j === m.j).forEach(a => {
      const before = cum[a.name] || 0, after = before + (a.ya || 0); cum[a.name] = after;
      if (a.rc || Math.floor(after / cfg.cycle) > Math.floor(before / cfg.cycle)) (M.suspended[next.j] = M.suspended[next.j] || new Set()).add(a.name);
    });
  });
  // alertas extra
  const extra = [];
  for (const p of M.players) {
    if (p.estado === 'Baja' || p.injury) continue;
    const wl = M.wellBy[p.name] || [];
    const last = wl[wl.length - 1], prev = wl[wl.length - 2];
    const lastSes = M.sessions.length ? M.sessions[M.sessions.length - 1].date : 0;
    if (last && lastSes - last.date <= 7) {
      if (last.h >= cfg.hooper && prev && prev.h >= cfg.hooper) extra.push({ sev: 3, p, t: 'Bienestar bajo', d: `Hooper ${last.h} y ${prev.h} en las dos últimas tomas` });
      else if (last.h >= cfg.hooper) extra.push({ sev: 2, p, t: 'Bienestar bajo', d: `Hooper ${last.h} el ${ddmm(last.date)}` });
      const bad = WELL_ITEMS.filter(([k]) => last.w[k] >= 6);
      if (bad.length) extra.push({ sev: 2, p, t: 'Ítem de bienestar alto', d: bad.map(([k, l]) => `${l} ${last.w[k]}/7`).join(', ') + ` (${ddmm(last.date)})` });
    }
    const recent = entr.filter(s => s.date > lastSes - 28 && s.aus[p.name] === 'Sin justificar').length;
    if (recent >= 2) extra.push({ sev: 2, p, t: 'Faltas sin justificar', d: `${recent} en las últimas 4 semanas` });
  }
  // la alerta "sin entrenar" solo cuenta faltas no justificadas
  M.alerts = M.alerts.filter(a => a.t !== 'Sin entrenar');
  const ents = entr.slice().sort((a, b) => b.date - a.date);
  for (const p of M.players) {
    if (p.estado === 'Baja' || p.estado === 'Invitado' || p.injury) continue;
    let miss = 0; for (const e of ents) { if (e.rpe[p.name] != null) break; if (e.aus[p.name] && e.aus[p.name] !== 'Sin justificar') continue; miss++; }
    if (miss >= cfg.missStreak) {
      const lastE = ents.find(e => e.rpe[p.name] != null);
      extra.push({ sev: 1, p, t: 'Sin entrenar', d: `${miss} sesiones sin registrar ni justificar` + (lastE ? ` · último entreno ${ddmm(lastE.date)}` : '') });
    }
  }
  M.alerts = M.alerts.concat(extra).sort((a, b) => b.sev - a.sev || a.p.i - b.p.i);
  return M;
}

}

function themePref() { try { const v = localStorage.getItem('myteam-theme'); return v === 'light' || v === 'dark' ? v : 'auto'; } catch (_) { return 'auto'; } }
function applyColorScheme() {
  const v = themePref(), root = document.documentElement;
  if (v === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', v);
  const dark = v === 'dark' || (v === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  root.style.colorScheme = v === 'auto' ? '' : v;
  let m = document.querySelector('meta[name="theme-color"]');
  if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.append(m); }
  m.content = dark ? '#141d19' : '#ffffff';
}
function setThemePref(v) { try { if (v === 'auto') localStorage.removeItem('myteam-theme'); else localStorage.setItem('myteam-theme', v); } catch (_) {} applyColorScheme(); $$('.themesw button').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('primary', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }); }
function themeSwitch() {
  const cur = themePref();
  return h('div', { class: 'controls themesw', role: 'group', 'aria-label': TH('Tema', 'Theme'), 'data-noi18n': '' },
    [['auto', TH('Automático', 'Automatic')], ['light', TH('Claro', 'Light')], ['dark', TH('Oscuro', 'Dark')]].map(([v, l]) =>
      h('button', { class: 'btn sm' + (cur === v ? ' primary' : ''), type: 'button', 'data-v': v, 'aria-pressed': cur === v ? 'true' : 'false', onclick: () => setThemePref(v) }, l)));
}
function themePanel() {
  return h('div', { class: 'panel section-gap', 'data-noi18n': '' }, h('h3', null, TH('Apariencia', 'Appearance')),
    h('div', { class: 'sub', style: 'margin:-6px 0 10px' }, TH('Automático sigue el modo claro u oscuro de tu teléfono. Se guarda solo en este dispositivo.', 'Automatic follows your phone\'s light or dark mode. Saved on this device only.')),
    themeSwitch());
}
applyColorScheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyColorScheme);

/* ================= ponerse al día: pasar datos que el entrenador ya tenía apuntados ================= */
const AL = (es, en) => LANG === 'en' ? en : es;
const AD_STEPS = () => [['players', AL('Jugadores', 'Players')], ['results', AL('Resultados', 'Results')], ['minutes', AL('Minutos', 'Minutes')], ['totals', AL('Goles y asistencia', 'Goals & attendance')]];
const adNorm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const adCells = line => line.includes('\t') ? line.split('\t') : line.includes(';') ? line.split(';') : line.split(/\s{2,}|,(?=\s*\S)/);
const adAppend = (el, ...kids) => el.append(...kids.filter(x => x != null && x !== false));
const adNum = v => { const s = String(v ?? '').trim().replace(',', '.'); if (s === '') return null; const n = +s; return isFinite(n) ? n : null; };
function adFindPlayer(M, txt) {
  const t = adNorm(txt).replace(/^\d+\s*[·.\-)]?\s*/, ''); if (!t) return null;
  return M.players.find(p => adNorm(p.name) === t) || M.players.find(p => adNorm(p.name + ' ' + (p.ap || '')) === t)
    || M.players.find(p => t.startsWith(adNorm(p.name) + ' ')) || null;
}
function adPasteBox(placeholder, onParse) {
  const ta = h('textarea', { rows: 4, placeholder, style: 'width:100%;font:inherit;font-size:.9rem;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)' });
  const msg = h('div', { class: 'sub', style: 'margin-top:6px' });
  const run = () => { const r = onParse(ta.value); msg.textContent = r || ''; };
  ta.addEventListener('paste', () => setTimeout(run, 0));
  return h('details', { class: 'section-gap' }, h('summary', { style: 'cursor:pointer;font-weight:600;color:var(--accent)' }, AL('¿Lo tienes en un Excel? Pégalo aquí', 'Got it in a spreadsheet? Paste it here')),
    h('div', { style: 'margin-top:8px' }, ta, h('div', { class: 'bar-actions', style: 'margin-top:6px' }, h('button', { class: 'btn sm', type: 'button', onclick: run }, AL('Leer lo pegado', 'Read pasted data'))), msg));
}
function vAlDia(main) {
  const M = MODEL, edit = canEdit();
  if (!edit) { main.append(h('div', { class: 'panel empty' }, AL('Solo quien gestiona el equipo puede pasar datos.', 'Only the team manager can enter data.'))); return; }
  if (!M) { main.append(emptyState()); return; }
  const steps = AD_STEPS(), st = UI.ad = UI.ad || { step: M.players.length ? 'results' : 'players' };
  const idx = steps.findIndex(s => s[0] === st.step);
  const goStep = k => { st.step = k; UI.editing = false; route(); scrollTo(0, 0); };
  const next = () => idx < steps.length - 1 ? goStep(steps[idx + 1][0]) : (UI.ad = null, toast(AL('¡Listo! Ya tienes tus datos en My Team', 'Done! Your data is now in My Team')), go('resumen'));
  main.append(h('div', { class: 'view-head', 'data-noi18n': '' }, h('div', null, h('h2', null, AL('Ponerse al día', 'Catch up')),
    h('div', { class: 'sub' }, AL('Si ya llevabas la temporada apuntada en otro sitio, pásala aquí en unos minutos. Puedes saltarte lo que no tengas y volver cuando quieras desde Plantilla.',
      'If you were already tracking the season somewhere else, bring it in here in a few minutes. Skip what you don\'t have and come back any time from Squad.')))));
  main.append(h('div', { class: 'controls', style: 'gap:6px;flex-wrap:wrap;margin-bottom:14px', role: 'tablist', 'data-noi18n': '' }, steps.map(([k, l], i) =>
    h('button', { class: 'btn sm' + (k === st.step ? ' primary' : ''), type: 'button', role: 'tab', 'aria-selected': k === st.step ? 'true' : 'false', onclick: () => goStep(k) }, (i + 1) + '. ' + l))));
  const box = h('div', { class: 'panel', 'data-noi18n': '', 'data-nomc': '' });
  main.append(box);
  const footer = (saveFn, label) => {
    const b = h('button', { class: 'btn primary', type: 'button', onclick: async () => { b.disabled = true; try { const ok = await saveFn(); if (ok !== false) next(); } catch (e) { console.error(e); toast(errText(e), true); } b.disabled = false; } },
      label || (idx < steps.length - 1 ? AL('Guardar y seguir', 'Save and continue') : AL('Guardar y terminar', 'Save and finish')));
    return h('div', { class: 'bar-actions' }, b, h('button', { class: 'btn', type: 'button', onclick: next }, idx < steps.length - 1 ? AL('Saltar este paso', 'Skip this step') : AL('Terminar', 'Finish')));
  };
  ({ players: adPlayers, results: adResults, minutes: adMinutes, totals: adTotals })[st.step](M, box, footer);
}

/* 1 · jugadores */
function adPlayers(M, box, footer) {
  const ta = h('textarea', { rows: 10, style: 'width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)',
    placeholder: AL('Un jugador por línea, por ejemplo:\n1 Hugo POR\n4 Pablo DFC\n10 Leo MCO\n\nTambién puedes pegar las columnas de un Excel (dorsal, nombre, posición).', 'One player per line, for example:\n1 Hugo POR\n4 Pablo DFC\n10 Leo MCO\n\nYou can also paste spreadsheet columns (number, name, position).') });
  const prev = h('div', { class: 'sub', style: 'margin-top:8px' });
  const parse = () => ta.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    let parts = l.includes('\t') || l.includes(';') ? adCells(l).map(x => x.trim()).filter(Boolean) : l.split(/\s+/);
    let dorsal = null, pos = '';
    parts = parts.filter(x => { const u = x.toUpperCase().replace(/[.,]$/, ''); if (dorsal == null && /^\d{1,2}$/.test(x)) { dorsal = +x; return false; } if (!pos && POSITIONS.includes(u)) { pos = u; return false; } return true; });
    return { name: parts.join(' ').replace(/\s+/g, ' ').trim(), dorsal, pos };
  }).filter(x => x.name);
  const show = () => { const L = parse(), have = new Set(M.players.map(p => adNorm(p.name))); const nw = L.filter(x => !have.has(adNorm(x.name)));
    prev.textContent = L.length ? AL(`${nw.length} jugador${nw.length === 1 ? '' : 'es'} nuevo${nw.length === 1 ? '' : 's'}`, `${nw.length} new player${nw.length === 1 ? '' : 's'}`) + (L.length > nw.length ? AL(` · ${L.length - nw.length} ya estaban`, ` · ${L.length - nw.length} already in the squad`) : '') + ': ' + nw.map(x => (x.dorsal != null ? x.dorsal + ' ' : '') + x.name + (x.pos ? ' (' + x.pos + ')' : '')).join(', ') : ''; };
  ta.addEventListener('input', show);
  adAppend(box, h('h3', null, AL('¿Quién está en tu plantilla?', "Who's in your squad?")),
    M.players.length ? h('p', { class: 'sub' }, AL(`Ya tienes ${M.players.length} jugadores. Añade aquí los que falten o salta este paso.`, `You already have ${M.players.length} players. Add any missing ones here or skip this step.`)) : null,
    h('p', { class: 'sub' }, AL('Escribe o pega la lista. El dorsal y la posición son opcionales (posiciones: ', 'Type or paste the list. Number and position are optional (positions: ') + POSITIONS.join(', ') + ').'),
    ta, prev,
    footer(async () => {
      const have = new Set(M.players.map(p => adNorm(p.name))), used = new Set((M.docs.players || []).map(p => p.i));
      const L = parse().filter(x => { const k = adNorm(x.name); if (have.has(k)) return false; have.add(k); return true; });
      if (!L.length) { if (!M.players.length) { toast(AL('Escribe al menos un jugador', 'Enter at least one player'), true); return false; } return true; }
      let i = 0;
      for (const x of L) {
        while (used.has(i) && i < 40) i++;
        if (i >= 40) { toast(AL('Máximo 40 jugadores', 'Maximum 40 players'), true); break; }
        used.add(i);
        await writeDoc('players', 'p' + pad2(i), { i, name: x.name, dorsal: x.dorsal, ap: '', pos: x.pos, estado: 'Activo', fcmax: null, fcrest: null, prev: {} });
      }
      toast(AL(`${L.length} jugadores añadidos`, `${L.length} players added`));
    }));
}

/* 2 · resultados */
function adResults(M, box, footer) {
  const rows = h('tbody');
  const docs = (M.docs.matches || []).slice().sort((a, b) => a.j - b.j);
  const mk = d => {
    const m = M.matches.find(x => x.j === d.j);
    const tr = h('tr', { 'data-j': d.j },
      h('td', null, h('input', { class: 'n xs', type: 'number', min: 1, max: 60, value: d.j, 'aria-label': AL('Jornada', 'Round'), 'data-k': 'j' })),
      h('td', null, h('input', { type: 'date', value: d.date != null ? isoOf(d.date) : '', 'aria-label': AL('Fecha', 'Date'), 'data-k': 'date', style: 'width:140px' })),
      h('td', null, h('input', { type: 'text', value: d.rival || '', placeholder: AL('Rival', 'Opponent'), 'aria-label': AL('Rival', 'Opponent'), 'data-k': 'rival', style: 'min-width:120px' })),
      h('td', null, h('select', { 'data-k': 'campo', 'aria-label': AL('Campo', 'Venue') }, [['Local', AL('Casa', 'Home')], ['Visitante', AL('Fuera', 'Away')]].map(([v, l]) => h('option', { value: v, selected: (d.campo || 'Local') === v }, l)))),
      h('td', null, h('input', { class: 'n xs', type: 'number', min: 0, max: 99, value: m && m.played ? m.gf : '', 'aria-label': AL('Goles a favor', 'Goals for'), 'data-k': 'gf' })),
      h('td', null, h('input', { class: 'n xs', type: 'number', min: 0, max: 99, value: m && m.played ? m.gc : '', 'aria-label': AL('Goles en contra', 'Goals against'), 'data-k': 'gc' })));
    rows.append(tr); return tr;
  };
  docs.forEach(mk);
  const addRow = () => { const js = $$('tr[data-j] input[data-k=j]', rows).map(i => +i.value || 0); mk({ j: (Math.max(0, ...js) + 1), campo: 'Local' }).querySelector('[data-k=rival]').focus(); };
  if (!docs.length) for (let k = 0; k < 3; k++) addRow();
  const paste = adPasteBox(AL('Columnas: jornada, fecha, rival, casa/fuera, goles a favor, goles en contra\n1\t14/09/2026\tCD Rincón\tCasa\t2\t1', 'Columns: round, date, opponent, home/away, goals for, goals against\n1\t14/09/2026\tCD Rincón\tHome\t2\t1'), txt => {
    let n = 0;
    txt.split(/\r?\n/).forEach(l => {
      const c = adCells(l).map(x => x.trim()); const j = adNum((c[0] || '').replace(/^j(ornada)?\s*/i, '')); if (!j) return;
      let tr = rows.querySelector(`tr[data-j="${j}"]`) || $$('tr', rows).find(r => +r.querySelector('[data-k=j]').value === j);
      if (!tr) { tr = mk({ j, campo: 'Local' }); }
      const dm = (c[1] || '').match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
      if (dm) { let y = +dm[3]; if (y < 100) y += 2000; tr.querySelector('[data-k=date]').value = `${y}-${pad2(+dm[2])}-${pad2(+dm[1])}`; }
      else if (/^\d{4}-\d{2}-\d{2}$/.test(c[1] || '')) tr.querySelector('[data-k=date]').value = c[1];
      if (c[2]) tr.querySelector('[data-k=rival]').value = c[2];
      if (c[3]) tr.querySelector('[data-k=campo]').value = /^(f|v|a)/i.test(c[3]) ? 'Visitante' : 'Local';
      const sc = (c[4] || '').match(/^(\d+)\s*[-–:]\s*(\d+)$/);
      if (sc) { tr.querySelector('[data-k=gf]').value = sc[1]; tr.querySelector('[data-k=gc]').value = sc[2]; }
      else { if (c[4] !== undefined && c[4] !== '') tr.querySelector('[data-k=gf]').value = adNum(c[4]) ?? ''; if (c[5] !== undefined && c[5] !== '') tr.querySelector('[data-k=gc]').value = adNum(c[5]) ?? ''; }
      n++;
    });
    return n ? AL(`${n} partidos leídos. Revísalos en la tabla.`, `${n} matches read. Check them in the table.`) : AL('No he encontrado partidos. La primera columna debe ser el número de jornada.', 'No matches found. The first column must be the round number.');
  });
  adAppend(box, h('h3', null, AL('Partidos que ya has jugado', 'Matches already played')),
    h('p', { class: 'sub' }, AL('Pon el resultado de cada jornada. Deja los goles vacíos en los partidos que aún no se han jugado.', 'Enter each round\'s score. Leave goals empty for matches not played yet.')),
    h('div', { class: 'tablewrap' }, h('table', { 'data-nomc': '' }, h('thead', null, h('tr', null, ['J', AL('Fecha', 'Date'), AL('Rival', 'Opponent'), AL('Campo', 'Venue'), AL('GF', 'GF'), AL('GC', 'GA')].map(x => h('th', null, x)))), rows)),
    h('div', { class: 'bar-actions', style: 'margin-top:8px' }, h('button', { class: 'btn sm', type: 'button', onclick: addRow }, AL('+ Añadir jornada', '+ Add round'))),
    paste,
    footer(async () => {
      const seen = new Set(); let n = 0;
      for (const tr of $$('tr', rows)) {
        const g = k => tr.querySelector(`[data-k=${k}]`).value.trim();
        const j = Math.round(+g('j')); if (!j) continue;
        if (seen.has(j)) { toast(AL(`La jornada ${j} está repetida`, `Round ${j} is repeated`), true); return false; }
        seen.add(j);
        const rival = g('rival'), gf = adNum(g('gf')), gc = adNum(g('gc')), date = g('date') ? serialOf(g('date')) : null;
        if (!rival && gf == null && gc == null && date == null) continue;
        const old = (M.docs.matches || []).find(x => x.j === j) || { id: 'j' + pad2(j), j, acta: [] };
        const { id, ...body } = old;
        const nd = { ...body, j, rival: rival || body.rival || '', campo: g('campo') || body.campo || 'Local', date: date ?? body.date ?? null };
        const oldM = M.matches.find(x => x.j === j);
        const sameScore = oldM && oldM.played && oldM.gf === gf && oldM.gc === gc;
        if (!sameScore && !(body.goals && body.goals.length)) { nd.gf1 = gf; nd.gc1 = gc; nd.gf2 = gf == null ? null : 0; nd.gc2 = gc == null ? null : 0; }
        if (JSON.stringify(nd) !== JSON.stringify({ ...body })) { await writeDoc('matches', id, nd); n++; }
      }
      if (n) toast(AL(`${n} partidos guardados`, `${n} matches saved`));
    }));
}

/* 3 · minutos por partido */
function adMinutes(M, box, footer) {
  const played = M.matches.filter(m => m.played);
  if (!played.length) { adAppend(box, h('h3', null, AL('Minutos por partido', 'Minutes per match')), h('p', { class: 'sub' }, AL('Primero pon los resultados de los partidos jugados (paso 2).', 'First enter the results of the matches played (step 2).')), footer(async () => true, AL('Seguir', 'Continue'))); return; }
  const st = UI.ad; st.mins = st.mins || {};   // borrador { j: { pid: 'valor' } }
  const players = M.players.filter(p => p.estado !== 'Baja' || M.actas.some(a => a.name === p.name));
  const fromActa = m => { const o = {}; M.actas.filter(a => a.j === m.j).forEach(a => { const p = M.players.find(x => x.name === a.name); if (p) o[p.id] = (a.tit ? '*' : '') + a.min; }); return o; };
  played.forEach(m => { if (!st.mins[m.j]) st.mins[m.j] = fromActa(m); });
  const cur = st.j && played.some(m => m.j === st.j) ? st.j : played[0].j, m = played.find(x => x.j === cur);
  const filled = j => Object.values(st.mins[j] || {}).some(v => String(v).trim() !== '');
  const jsel = h('div', { class: 'controls', style: 'gap:6px;flex-wrap:wrap' }, played.map(x => h('button', { class: 'btn sm' + (x.j === cur ? ' primary' : ''), type: 'button', title: shortRival(x.rival),
    onclick: () => { st.j = x.j; route(); } }, RL('J', 'R') + x.j + (filled(x.j) ? ' ✓' : ''))));
  const list = h('div', { class: 'adm' });
  players.forEach(p => {
    const v = String(st.mins[cur][p.id] ?? ''), tit = v.startsWith('*'), mins = v.replace('*', '');
    const inp = h('input', { class: 'n', type: 'number', min: 0, max: m.dur + 30, inputmode: 'numeric', value: mins, placeholder: '—', 'aria-label': AL('Minutos de ', 'Minutes for ') + p.name, style: 'width:72px' });
    const tb = h('button', { class: 'btn sm' + (tit ? ' primary' : ''), type: 'button', 'aria-pressed': tit ? 'true' : 'false', title: AL('Titular', 'Starter') }, AL('Titular', 'Starter'));
    const full = h('button', { class: 'btn sm', type: 'button', title: AL('Partido completo', 'Full match') }, m.dur + "'");
    const save = () => { st.mins[cur][p.id] = inp.value === '' ? '' : (tb.getAttribute('aria-pressed') === 'true' ? '*' : '') + inp.value; jsel.querySelectorAll('button')[played.indexOf(m)].textContent = RL('J', 'R') + cur + (filled(cur) ? ' ✓' : ''); };
    inp.addEventListener('input', save);
    tb.onclick = () => { const on = tb.getAttribute('aria-pressed') !== 'true'; tb.setAttribute('aria-pressed', on); tb.classList.toggle('primary', on); if (on && inp.value === '') inp.value = m.dur; save(); };
    full.onclick = () => { inp.value = m.dur; tb.setAttribute('aria-pressed', 'true'); tb.classList.add('primary'); save(); };
    list.append(h('div', { class: 'adm-row' }, h('span', { class: 'adm-n' }, (p.dorsal != null ? p.dorsal + ' · ' : '') + p.name, h('small', null, ' ' + (p.pos || ''))), inp, full, tb));
  });
  const paste = adPasteBox(AL('Primera fila: las jornadas (J1, J2…). Debajo, una fila por jugador: nombre y sus minutos en cada jornada. Pon * delante para marcar titular (*90). Vacío = no convocado; 0 = convocado sin jugar.',
    'First row: the rounds (R1, R2…). Below, one row per player: name and their minutes in each round. Put * in front to mark a starter (*90). Empty = not in squad; 0 = in squad, did not play.'), txt => {
    const L = txt.split(/\r?\n/).filter(l => l.trim()); if (L.length < 2) return AL('Pega al menos la fila de jornadas y un jugador.', 'Paste at least the rounds row and one player.');
    const head = adCells(L[0]).map(x => adNum(String(x).replace(/^\s*(j(ornada)?|r(ound)?)\s*/i, '')));
    let np = 0, miss = [];
    L.slice(1).forEach(l => {
      const c = adCells(l), p = adFindPlayer(M, c[0]); if (!p) { if (c[0] && c[0].trim()) miss.push(c[0].trim()); return; }
      np++;
      c.slice(1).forEach((v, k) => { const j = head[k + 1]; if (!j || !st.mins[j]) return; const s = String(v).trim().replace(/'$/, ''); if (s === '' || /^-+$/.test(s)) return; if (/^\*?\d+$/.test(s)) st.mins[j][p.id] = s; });
    });
    setTimeout(route, 400);
    return AL(`Leídos ${np} jugadores.`, `Read ${np} players.`) + (miss.length ? AL(' No encuentro en la plantilla: ', ' Not found in the squad: ') + miss.join(', ') : '');
  });
  adAppend(box, h('h3', null, AL('Minutos por partido', 'Minutes per match')),
    h('p', { class: 'sub' }, AL('Elige la jornada y pon los minutos de cada jugador. Vacío = no convocado; 0 = convocado sin jugar. «Titular» marca a los que salieron de inicio.',
      'Pick the round and enter each player\'s minutes. Empty = not in squad; 0 = in squad, did not play. “Starter” marks those who started.')),
    jsel, h('div', { class: 'sub', style: 'margin:10px 0 6px;font-weight:600' }, RL('J', 'R') + m.j + ' · ' + shortRival(m.rival) + ' · ' + resL(m.res) + ' ' + scoreText(m) + ' · ' + m.dur + "'"),
    list, paste,
    footer(async () => {
      let n = 0;
      for (const mm of played) {
        const vals = st.mins[mm.j] || {}; if (!Object.values(vals).some(v => String(v).trim() !== '')) continue;
        const d0 = (M.docs.matches || []).find(x => x.j === mm.j); if (!d0) continue;
        const old = Object.fromEntries((d0.acta || []).map(a => [a.pid, a]));
        const before = fromActa(mm);
        const acta = Object.entries(vals).filter(([, v]) => String(v).trim() !== '').map(([pid, v]) => {
          const tit = String(v).startsWith('*'), mt = Math.max(0, Math.round(+String(v).replace('*', '')));
          if (old[pid] && before[pid] === v) return old[pid];   // sin cambios: se respeta el acta detallada
          return { goals: 0, ast: 0, ya: 0, rc: 0, gc: 0, val: null, notes: '', dem: '', e: null, s: null, re: null, rs: null, ...(old[pid] || {}), pid, tit, mt };
        });
        const same = JSON.stringify(acta) === JSON.stringify(d0.acta || []);
        if (!same) { const { id, ...body } = d0; await writeDoc('matches', id, { ...body, acta }); n++; }
      }
      if (n) toast(AL(`Minutos guardados en ${n} partidos`, `Minutes saved for ${n} matches`));
    }));

/* 4 · goles, tarjetas y asistencia a entrenos */

/* ================= informe individual por periodos (semana · mes · vueltas · temporada) ================= */
const RL = (es, en) => LANG === 'en' ? en : es;

function repVueltaJ(M) {
  try { const v = +localStorage.getItem(repVKey(M)); if (v > 0) return v; } catch (_) {}
  const n = (M.table || []).length;
  if (n >= 3) return n % 2 ? n : n - 1;

  return maxJ >= 2 ? Math.ceil(maxJ / 2) : null;
}
function repSetVueltaJ(M, v) { try { if (v > 0) localStorage.setItem(repVKey(M), String(v)); else localStorage.removeItem(repVKey(M)); } catch (_) {} }
function repBounds(M) {
  const ds = [...M.sessions.map(s => s.date), ...M.matches.filter(m => m.played && m.date != null).map(m => m.date)];
  const first = ds.length ? Math.min(...ds) : M.cfg.start, last = ds.length ? Math.max(...ds) : todaySerial();
  return { first: Math.min(first, M.cfg.start), last, end: Math.max(last, todaySerial()) };
}
function repMonths(M) {

  M.sessions.forEach(s => add(s.date)); M.played.forEach(m => { if (m.date != null) add(m.date); });
  if (!set.size) add(todaySerial());
  return [...set].sort();
}
const repMonthName = ym => { const [y, m] = ym.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString(LOC, { month: 'long', year: 'numeric', timeZone: 'UTC' }); return t[0].toUpperCase() + t.slice(1); };
const repRange = (a, b) => ddmmyy(a) + ' – ' + ddmmyy(b);
function repPeriod(M, sel) {
  const cfg = M.cfg, B = repBounds(M), k = sel.k || 'season';
  if (k === 'week') {
    const w = Math.min(Math.max(1, sel.w || lastWeekWithData()), M.maxW), d0 = cfg.start + (w - 1) * 7;
    return { k, w, d0, d1: d0 + 6, label: RL('Semana ', 'Week ') + w, sub: repRange(d0, d0 + 6), file: RL('semana_', 'week_') + w };

    const d0 = serialOf(`${y}-${pad2(mo)}-01`), d1 = serialOf(mo === 12 ? `${y + 1}-01-01` : `${y}-${pad2(mo + 1)}-01`) - 1;

    const mv = M.matches.find(m => m.j === V && m.date != null);

    const cut = after.length ? Math.max(endV1, Math.min(...after) - 1) : endV1;
    if (k === 'v1') return { k, V, jr: [1, V], d0: B.first, d1: cut, prev: true, label: RL('1ª vuelta', 'First half'), sub: RL(`J1–J${V}`, `R1–R${V}`) + ' · ' + repRange(B.first, cut), file: RL('1a_vuelta', 'first_half') };
    return { k, V, jr: [V + 1, 999], d0: cut + 1, d1: Math.max(B.end, cut + 1), label: RL('2ª vuelta', 'Second half'), sub: RL(`desde J${V + 1}`, `from R${V + 1}`) + ' · ' + repRange(cut + 1, Math.max(B.end, cut + 1)), file: RL('2a_vuelta', 'second_half') };
  }

function repStats(M, p, P) {

    conv: new Set(A.map(a => a.j)).size, tit: A.filter(a => a.tit).length, pj: A.filter(a => a.min > 0).length, min: sum(A, a => a.min),
    minPos: sum(played, m => m.dur), goals: sum(A, a => a.goals) + (pv.goals || 0), ast: sum(A, a => a.ast) + (pv.ast || 0),
    ya: sum(A, a => a.ya) + (pv.ya || 0), rc: sum(A, a => a.rc) + (pv.rc || 0), pvAny: !!(pv.goals || pv.ast || pv.ya || pv.rc),
    gc: p.pos === 'POR' ? sum(A, a => a.gc) + (pv.gc || 0) : null, val: mean(A.filter(a => a.val != null).map(a => a.val)),
    ent: mine.length + (P.prev ? (pv.ent || 0) : 0), entTeam: ent.length + (P.prev ? (M.cfg.prevEnt || 0) : 0), nSes: done.length, rpe: mean(mine.map(s => s.rpe[n])), rpeAll: mean(done.map(s => s.rpe[n])),
    load: sum(ses, s => s.load[n]), loadW: sum(ses, s => s.load[n]) / nWeeks, acwr: lastW ? lastW.acwr : null, zone: lastW ? lastW.zone : zoneOf(null, M.cfg),
    acwrMax: wkOn.length ? Math.max(...wkOn.map(x => x.acwr ?? 0)) : null, mono: mean(wkOn.filter(x => x.mono != null).map(x => x.mono)),
    hooper: mean(wl.map(e => e.h)), hooperMax: wl.length ? Math.max(...wl.map(e => e.h)) : null, nWell: wl.length,
    trimp: sum(M.fc.filter(f => f.name === n && inD(f.date)), f => f.trimp),
    ausJ: missed.filter(s => s.aus[n] && s.aus[n] !== 'Sin justificar').length, ausI: missed.filter(s => s.aus[n] === 'Sin justificar').length,
    ausN: missed.filter(s => !s.aus[n]).length, ausList: missed.filter(s => s.aus[n]).map(s => ({ date: s.date, reason: s.aus[n] })),
    injuries: M.injuries.filter(x => x.name === n && x.date <= P.d1 && (x.alta == null || x.alta >= P.d0)),
    tests: M.tests.filter(t => t.res[n] && inD(t.date)), testPrev: M.tests.filter(t => t.res[n] && t.date < P.d0).slice(-1)[0] || null,
    objectives: (M.objectives || []).filter(o => o.pid === p.id) };

    if (!A.length) continue;

    if (m.played && tit !== nXI()) out.push({ sev: 2, t: 'Titulares distintos de ' + nXI(), d: `J${m.j}: ${tit} titulares`, fix: openM });
    let maxOn = 0, at = 0;
    for (let t = 1; t <= m.dur; t++) { const n = A.filter(a => onFieldAt(a, t)).length; if (n > maxOn) { maxOn = n; at = t; } }
    if (!A.some(a => a.manual) && maxOn > nXI()) out.push({ sev: 2, t: 'Más de ' + nXI() + ' en el campo', d: `J${m.j}: ${maxOn} jugadores en el minuto ${at}; revisa los cambios`, fix: openM });

function enrichModel3(M) {
  const D = M.docs, cfg = M.cfg, today = todaySerial();
  // ---------- liga ----------
  const base = M.rawRows.map(r => ({ t: r.t, us: r.us, G: r.G, E: r.E, P: r.P, GF: r.GF, GC: r.GC }));
  if (!base.some(r => r.us)) base.unshift({ t: cfg.team, us: true, G: 0, E: 0, P: 0, GF: 0, GC: 0 });
  const tb = (D.table && D.table.baseJ != null) ? D.table.baseJ : Math.max(0, ...base.map(r => r.G + r.E + r.P));
  const usName = cfg.team;
  const leagueDocs = Object.fromEntries((D.league || []).map(x => [x.j, x]));
  const rounds = {};
  for (const [j, d] of Object.entries(leagueDocs)) rounds[j] = (d.games || []).filter(g => g.home && g.away && g.hg != null && g.ag != null).map(g => ({ ...g }));
  for (const m of M.played) {
    const r = rounds[m.j] = rounds[m.j] || [];
    if (r.some(g => g.home === usName || g.away === usName)) continue;
    const home = m.campo === 'Visitante' ? m.rival : usName, away = m.campo === 'Visitante' ? usName : m.rival;
    r.push({ home, away, hg: m.campo === 'Visitante' ? m.gc : m.gf, ag: m.campo === 'Visitante' ? m.gf : m.gc, auto: true });
  }
  M.leagueRounds = rounds;
  const rowsBy = {}; base.forEach(r => { rowsBy[r.t] = r; });
  const unknown = new Set();
  const add = (team, gf, gc) => {
    let r = rowsBy[team];
    if (!r) { r = rowsBy[team] = { t: team, us: team === usName, G: 0, E: 0, P: 0, GF: 0, GC: 0 }; base.push(r); unknown.add(team); }
    r.GF += gf; r.GC += gc; if (gf > gc) r.G++; else if (gf === gc) r.E++; else r.P++;
  };
  const sorted = () => base.map(r => ({ ...r, PJ: r.G + r.E + r.P, Pts: 3 * r.G + r.E, DIF: r.GF - r.GC }))
    .sort((x, y) => y.Pts - x.Pts || y.DIF - x.DIF || y.GF - x.GF || x.t.localeCompare(y.t));
  const posHist = [];
  const js = Object.keys(rounds).map(Number).filter(j => j > tb && rounds[j].length).sort((a, b) => a - b);
  for (const j of js) { rounds[j].forEach(g => { add(g.home, g.hg, g.ag); add(g.away, g.ag, g.hg); }); const s = sorted(); posHist.push({ j, pos: s.findIndex(r => r.us) + 1, pts: (s.find(r => r.us) || {}).Pts }); }
  M.table = sorted();
  M.leagueInfo = { baseJ: tb, lastJ: js.length ? js[js.length - 1] : tb, rounds: js.length, unknown: [...unknown].filter(t => t !== usName), posHist };
  // ---------- objetivos ----------
  const nameOf = Object.fromEntries(M.players.map(p => [p.id, p.name]));
  M.objectives = (D.objectives || []).filter(o => nameOf[o.pid]).map(o => {
    const name = nameOf[o.pid];
    let actual = o.actual ?? null, actualDate = null;
    if (o.metric) {
      const ts = M.tests.filter(t => t.res[name] && t.res[name][o.metric] != null);
      if (ts.length) { const t = ts[ts.length - 1]; actual = t.res[name][o.metric]; actualDate = t.date; }
    }
    let prog = null;
    if (o.ini != null && o.target != null && actual != null && o.target !== o.ini) prog = Math.max(0, Math.min(1, (actual - o.ini) / (o.target - o.ini)));
    const overdue = o.estado === 'En curso' && o.limite != null && o.limite < today;
    return { ...o, name, actual, actualDate, prog, overdue };
  }).sort((a, b) => (a.estado === 'En curso' ? 0 : 1) - (b.estado === 'En curso' ? 0 : 1) || (a.limite ?? 1e9) - (b.limite ?? 1e9));
  M.objectives.filter(o => o.overdue).forEach(o => {
    const p = M.players.find(x => x.id === o.pid);
    if (p && p.estado !== 'Baja') M.alerts.push({ sev: 1, p, t: 'Objetivo vencido', d: `${o.titulo} (límite ${ddmm(o.limite)})` });
  });
  M.alerts.sort((a, b) => b.sev - a.sev || a.p.i - b.p.i);
  return M;
}

function parseBackupText(txt) {

async function importBackup(file, onProgress) {

  const db = store.db; if (!db) throw new Error('Sin base de datos');

  for (const tid of existing) for (const c of COLS) { const snap = await colRef(c, tid).get(); snap.docs.forEach(d => jobs.push(() => colRef(c, tid).doc(d.id).delete())); }
  { const snap = await db.collection('teamlist').get(); snap.docs.forEach(d => jobs.push(() => db.collection('teamlist').doc(d.id).delete())); }

    const D = t.docs, tid = t.id || 'main';
    for (const c of COLS) {

      for (const d of (D[c] || [])) { const { id, ...b } = d; if (id) jobs.push(() => colRef(c, tid).doc(id).set(clean(b))); }

}

async function loadDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const names = [['Hugo', 'POR'], ['Dani', 'POR'], ['Álex', 'LD'], ['Iker', 'DFC'], ['Pablo', 'DFC'], ['Rubén', 'DFC'], ['Marc', 'LI'], ['Javi', 'LD'], ['Sergio', 'MCD'], ['Adrián', 'MC'], ['Nico', 'MC'], ['Leo', 'MCO'], ['Mateo', 'ED'], ['Izan', 'EI'], ['Lucas', 'DC'], ['Bruno', 'DC'], ['Unai', 'EI'], ['Gonzalo', 'MC']];
  const players = names.map(([n, pos], i) => ({ id: 'p' + pad2(i), i, name: n, ap: '', dorsal: i === 1 ? 13 : i + 1 - (i > 1 ? 1 : 0), pos, estado: 'Activo', fcmax: null, fcrest: null, prev: { goals: 0, ast: 0, ya: 0, rc: 0, gc: 0 } }));
  const today = todaySerial(), dow0 = (sdate(today).getUTCDay() + 6) % 7;
  const start = today - dow0 - 28; // lunes de hace 4 semanas
  const name = LANG === 'en' ? 'Sample team' : 'Equipo de ejemplo';
  const rivals = ['C.D. Atlético Norte', 'U.D. Los Pinos', 'E.F. Río Verde', 'C.F. San Roque', 'A.D. Las Lomas', 'C.D. Puerto Sur', 'U.D. Villanueva'];
  const sessions = [], matches = [];
  const XI = [0, 2, 3, 4, 6, 8, 9, 11, 12, 13, 14], BENCH = [1, 5, 7, 10, 15, 16, 17];
  for (let w = 0; w < 4; w++) {
    const mon = start + 7 * w;
    [[0, 'MD+1', 60, [2, 4], (LANG === 'en' ? 'Active recovery · Rondos · Mobility' : 'Recuperación activa · Rondos · Movilidad')], [2, 'MD-4', 90, [6, 8], (LANG === 'en' ? 'Warm-up · Strength + sprints · Possession 8v8 · Conditioned game' : 'Calentamiento · Fuerza + sprints · Posesión 8x8 · Partido condicionado')], [4, 'MD-2', 75, [4, 6], (LANG === 'en' ? 'Activation · Build-up play · Set pieces · 9v9 game' : 'Activación · Salida de balón · ABP · Partido 9x9')]].forEach(([d, md, dur, [lo, hi], content]) => {
      const rpe = {}; players.forEach(p => { if (rnd() > .1) rpe[p.id] = pick(lo, hi); });
      sessions.push({ id: 's' + (mon + d) + '-1', date: mon + d, dur, md, content, fc: {}, rpe });
    });
    const j = w + 1, mdate = mon + 6, gf1 = pick(0, 2), gf2 = pick(1, 2), gc1 = pick(0, 1), gc2 = pick(0, 1);
    const scorers = []; for (let g = 0; g < gf1 + gf2; g++) scorers.push(XI[pick(6, 10)]);
    const subsOut = [XI[pick(7, 10)], XI[pick(4, 6)], XI[pick(1, 3)]].filter((v, k, a) => a.indexOf(v) === k);
    const subsIn = BENCH.slice(1).sort(() => rnd() - .5).slice(0, subsOut.length);
    const acta = [];
    XI.forEach((pi, k) => acta.push({ pid: players[pi].id, tit: true, dem: players[pi].pos, s: subsOut.includes(pi) ? 60 + 10 * subsOut.indexOf(pi) : null, e: null, re: null, rs: null, goals: scorers.filter(x => x === pi).length, ast: 0, ya: rnd() > .85 ? 1 : 0, rc: 0, gc: pi === 0 ? gc1 + gc2 : 0, val: null, notes: '' }));
    subsIn.forEach((pi, k) => acta.push({ pid: players[pi].id, tit: false, dem: '', s: null, e: 60 + 10 * k, re: null, rs: null, goals: 0, ast: 0, ya: 0, rc: 0, gc: 0, val: null, notes: '' }));
    matches.push({ id: 'j' + pad2(j), j, date: mdate, rival: rivals[w], campo: j % 2 ? 'Visitante' : 'Local', dur: 90, gf1, gf2, gc1, gc2, tf1: pick(3, 8), tf2: pick(3, 8), tc1: pick(2, 6), tc2: pick(2, 6), tabla: null, obs: '', acta });
    const rpe = {}; acta.forEach(a => { rpe[a.pid] = pick(7, 9); });
    sessions.push({ id: 's' + mdate + '-1', date: mdate, dur: 90, md: 'MD', content: '', fc: {}, rpe });
  }
  for (let j = 5; j <= 7; j++) matches.push({ id: 'j' + pad2(j), j, date: start + 7 * (j - 1) + 6, rival: rivals[j - 1], campo: j % 2 ? 'Visitante' : 'Local', dur: 90, gf1: null, gf2: null, gc1: null, gc2: null, tf1: null, tf2: null, tc1: null, tc2: null, tabla: null, obs: '', acta: [] });
  const D = { config: { ...DEFAULT_CFG, team: name, start, dur: 90, compMin: 45, hooper: 18, missStreak: 3, acwrMode: 'ewma', trainDays: [0, 2, 4], lineOf: { ...DEFAULT_LINE } },
    table: { rows: [{ t: name, us: true }, ...rivals.map(t => ({ t, us: false }))], baseJ: 0 },
    players, sessions, matches, injuries: [], tests: [], plan: [], league: [], objectives: [] };
  for (const c of COLS) {
    if (c === 'config' || c === 'table') { await colRef(c).doc('main').set(clean(D[c])); continue; }
    for (const d of D[c]) { const { id, ...b } = d; await colRef(c).doc(id).set(clean(b)); }
  }
  await store.db.collection('teamlist').doc('main').set(clean({ name, cat: 'F11', crest: null, color: '#0f766e' }));
}

/* ================= boot ================= */
(async function boot() {
  route();
  const pdb = window.claude?.use ? window.claude.use('db') : Promise.resolve(null);
  const puser = window.claude?.use ? window.claude.use('user') : Promise.resolve(null);
  const [db, user] = await Promise.all([pdb, puser]);
  store.db = db;
  if (!db) {
    if (SNAP && SNAP.docs) {
      store.snapTeams = SNAP.teams && SNAP.teams.length ? SNAP.teams : [{ id: 'main', docs: SNAP.docs }];
      if (!store.snapTeams.some(t => t.id === store.team)) store.team = store.snapTeams[0].id;
      store.local = store.snapTeams.find(t => t.id === store.team).docs; store.fromSnap = true;
    }
    store.ready = true; rebuild();
    if (!store.fromSnap) toast('Abre esta página en Claude para ver los datos guardados.');
    return;
  }
  store.canWrite = true;
  if (user) {
    try { store.isAdmin = !!(await user.canEdit()); } catch (_) {}
    try { const c = await user.can('data.write'); if (c === false) { store.canWrite = false; store.canWriteKnown = true; } else if (c === true) store.canWriteKnown = true; } catch (_) {}
  }
  let firstList = true;
  db.collection('teamlist').onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => { if (d.exists) m.set(d.id, d.data()); });
    store.teams = m;
    if (firstList) { firstList = false; if (store.team !== 'main' && !m.has(store.team)) { store.team = 'main'; } subscribeTeam(); }
    else if (store.team !== 'main' && !m.has(store.team)) { switchTeam('main'); return; }
    applyTheme(teamMeta()); renderTeamSwitch(); if (store.ready) rebuild();
  }, err => { console.error('teamlist', err); if (firstList) { firstList = false; subscribeTeam(); } });
})();
